.tile.wm { border-top-color:var(--wm); } .tile.bt { border-top-color:var(--bt); }

.tile .d { font-size:13px; color:var(--ink-2); margin-top:6px; line-height:1.45; }
.chart { position:relative; }
.chart svg { display:block; width:100%; height:auto; overflow:visible; }

.chart text.lbl { fill:var(--ink-2); font-size:11.5px; font-weight:600; }
.chart .zero { stroke:var(--rule); stroke-width:1; }
.chart .cross { stroke:var(--ink-2); stroke-width:1; opacity:0; }
.chart path.line { fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
.chart path.area { opacity:.12; }
.chart .marker { stroke:var(--surface); stroke-width:2; }
.chart .hit { fill:transparent; }
.tip { position:absolute; pointer-events:none; z-index:5; background:var(--ink); color:var(--surface); font-size:12px; line-height:1.4; padding:8px 10px; border-radius:6px; opacity:0; transform:translate(-50%,-100%); white-space:nowrap; transition:opacity .08s; }
.tip .th { font-weight:700; margin-bottom:3px; } .tip .tr { display:flex; justify-content:space-between; gap:14px; } .tip .tr i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
.legend { display:flex; gap:8px 18px; flex-wrap:wrap; margin-top:8px; font-size:12.5px; color:var(--ink-2); }
.legend span { display:inline-flex; align-items:center; gap:7px; } .legend i { display:inline-block; width:18px; height:0; border-top:2px solid; } .legend i.dash { border-top-style:dashed; } .legend i.sq { width:12px; height:12px; border:0; border-radius:2px; }
.cap { font-size:13px; color:var(--ink-2); margin-top:10px; max-width:76ch; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
@media (max-width:700px){ .two { grid-template-columns:1fr; } }
table.t { width:100%; border-collapse:collapse; font-size:13.5px; margin-top:8px; }
table.t th, table.t td { padding:8px 10px; border-bottom:1px solid var(--rule-soft); text-align:right; white-space:nowrap; vertical-align:top; }
table.t th { font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--rule); }
table.t th:first-child, table.t td:first-child { text-align:left; white-space:normal; min-width:200px; }
table.t td.b, table.t th.b { text-align:left; white-space:normal; min-width:220px; }
table.t tr.total td { font-weight:700; border-top:1px solid var(--rule); }
table.t tr.sub td { color:var(--ink-2); }
.tscroll { overflow-x:auto; }
.delta { font-weight:700; } .up { color:var(--good); } .down { color:var(--bad); } .flat { color:var(--ink-2); }

.takeaways { display:grid; gap:12px; }
.take { display:grid; grid-template-columns:22px 1fr; gap:12px; font-size:14.5px; }
.take .n { width:22px; height:22px; border-radius:50%; background:var(--ink); color:var(--surface); font-size:12px; font-weight:700; display:grid; place-items:center; margin-top:2px; }
.take b { color:var(--ink); }
.take p { color:var(--ink-2); }
footer { margin-top:34px; padding-top:14px; border-top:1px solid var(--rule); font-size:12px; color:var(--muted); line-height:1.55; }
@media print {

  <p class="cap">From November 2025 to April 2026 Walmart reported double-digit growth while our archive showed declines of 7 to 11%. Both sources turned down in May 2026, the month Walmart began reporting a separate AI (“AEO”) channel. In August Walmart’s visits recovered to ${spct(T.wm_aug)}; Google clicks fell to ${spct(T.gsc_aug)}, the weakest month in the record.</p>
</section>

<section>
  <h2>How well do the two datasets line up?</h2>
  <p class="sub">They move together week to week and month to month; they do not agree on level or on direction over the year. The gap between them has widened steadily, so a click in our data has been worth an increasing number of Walmart visits.</p>
  <div class="two">
    <div>${idxChart}<p class="cap">Weekly totals, indexed to spring 2025. Same shape, diverging level.</p></div>
    <div>${ratioChart}<p class="cap">Walmart SEO visits per click in our archive, by month. A stable measurement gap would be a flat line.</p></div>
  </div>
  <div class="tscroll"><table class="t"><thead><tr><th>Measure of agreement</th><th>Google clicks</th><th>Google + Bing clicks</th><th class="b">Read</th></tr></thead><tbody>
    <tr><td>Correlation of weekly totals (levels)</td><td class="num">${C.r_levels_gsc.toFixed(2)}</td><td class="num">${C.r_levels_gb.toFixed(2)}</td><td class="b">Moderate. Both carry the same seasonality; the widening gap holds the coefficient down.</td></tr>
    <tr><td>Correlation of week-over-week changes</td><td class="num">${C.r_wow_gsc.toFixed(2)}</td><td class="num">${C.r_wow_gb.toFixed(2)}</td><td class="b">Good. When one moves, the other moves the same way that week.</td></tr>
    <tr><td>Correlation of monthly year-over-year rates (${C.n_monthly_yoy} months)</td><td class="num">${C.r_monthly_yoy.toFixed(2)}</td><td class="num">—</td><td class="b">Strong in shape, but Walmart runs ${C.mean_gap_pts.toFixed(0)} points higher on average. Same sign in only ${C.same_sign_months} of ${C.n_monthly_yoy} months.</td></tr>
    <tr><td>Visits per click, Nov 2024 → Aug 2026</td><td class="num">${rat[0].gsc.toFixed(1)}× → ${rat[rat.length - 1].gsc.toFixed(1)}×</td><td class="num">${(rat.find(r => r.gb) || {}).gb.toFixed(1)}× → ${rat.filter(r => r.gb).slice(-1)[0].gb.toFixed(1)}×</td><td class="b">Walmart’s SEO channel is counting a growing amount of traffic that search consoles do not see.</td></tr>
  </tbody></table></div>
  <p class="cap">Likely reasons, none confirmed by Walmart: a visit is a session and a click is a click; Walmart’s SEO channel includes every organic referrer plus surfaces such as Discover, images and shopping that Search Console’s web report excludes; Walmart attributes on a 3-day window; and traffic was reclassified when the AEO channel launched in May.</p>
</section>

<section>
  <h2>What this means</h2>
  <div class="takeaways">
    <div class="take"><div class="n">1</div><div><b>The clause as drafted would report a failed pilot in most plausible scenarios.</b><p>At Walmart’s own six-month trend, the site lands ${fmtM(tot.wb - tot.wm_central)} visits under the baseline before SpeedWorkers adds anything. Our mid case adds ${fmtM(tot.inc_mid)}. Only the high case, on the most optimistic recent trend, shows as positive incremental.</p></div></div>
    <div class="take"><div class="n">2</div><div><b>Our Google + Bing data cannot be the source of record, and should not set the baseline either.</b><p>It correlates with Walmart’s visits in shape but runs 20 points more negative on year-over-year and diverges further every month. A baseline from our data would be easy to beat and easy for Walmart to reject.</p></div></div>
    <div class="take"><div class="n">3</div><div><b>Ask for a baseline built on a method, not a month.</b><p>A trailing 13-week or 6-month year-over-year read from Walmart’s own data, frozen at launch, gives ${fmtM(tot.wm_low)} – ${fmtM(tot.wm_central)}. Alternatively, a URL-level holdout removes the trend argument entirely, which is what Frank’s framework recommended.</p></div></div>
    <div class="take"><div class="n">4</div><div><b>Two drafting gaps.</b><p>December is set as a full month while measurement closes on the 20th, and the AI (AEO) channel, where Walmart’s visits have doubled since June, is not mentioned.</p></div></div>
  </div>
</section>
