<section class="qs">
  <h2>Questions Walmart needs to answer before any of this is measurable</h2>
  <p class="sub">None of these has an answer in the documents Walmart has shared.</p>
  <div class="qlist">
    <div class="q"><b>How will AEO incremental be measured?</b><span>No prior year exists for the channel. Against a run-rate, a growth curve, or does every AEO visit count?</span></div>
    <div class="q"><b>Where does 4.5% come from?</b><span>${M0(G.total)} is ${spct(G.total / WB)} of the baseline they sent and ${spct(G.total / withGoal)} of baseline plus goal. If they are working from a different baseline, we should see it.</span></div>
    <div class="q"><b>Full months, or the 20 December close?</b><span>The baseline is monthly through December; the contract stops counting on the 20th. The eleven days are peak season at peak adoption.</span></div>
    <div class="q"><b>Is ${M0(G.total)} the pass mark or the stretch?</b><span>The contract had three levels. A single number changes what “the pilot worked” means.</span></div>
    <div class="q"><b>What is an SEO visit?</b><span>Walmart counts 2.4 to 3.3 visits for every click Google reports to us, and the ratio is rising. We need the channel definition in writing before it becomes the source of record.</span></div>
    <div class="q"><b>Is any of this ramp-aware?</b><span>Pages go live in tranches and adoption builds over weeks. A goal spread evenly across four months is not the same goal as one that expects most of it in November and December.</span></div>
  </div>
</section>
