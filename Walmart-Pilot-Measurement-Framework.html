function figProjection(D) {
  const view = S.projView, tier = S.projTier;
  const ctl = `<div class="ctl-row" style="margin:0 0 18px">
      <div class="ctl"><span class="lbl">View</span>
        ${seg('projView', [['range','Scenario range'],['engine','Engine split'],
                           ['monthly','Per month']])}</div>
      ${view === 'range' ? '' : `<div class="ctl"><span class="lbl">Scenario</span>
        ${seg('projTier', [['low','Low'],['mid','Mid'],['high','High']])}</div>`}
    </div>`;

  const note =
      view === 'engine'
    ? 'Each channel is integrated separately on its own seasonality, then summed — so '
      + 'this is the model’s own components shown apart rather than a new calculation. '
      + 'One scenario at a time: the bands cannot stack two scenarios deep.'
    : view === 'monthly'
    ? 'Revenue earned in each month, not a running total. The cumulative views cannot '
      + 'show a series’ shape, because integrating it hides it — so this is where '
      + 'seasonality and the cache ramp-up are actually visible, and where their very '
      + 'different sizes can be compared instead of taken on trust.'
    : 'Cumulative revenue from launch to the decision date. Low, mid and '
      + 'high are the same measure at three scenario settings rather than three different '
      + 'things — the width of the band is the finding, and mid is a midpoint we '
      + 'calculated rather than a figure anyone supplied.';

  const legendRow =
      view === 'engine'
    ? legend(revenueComponents(D.cfg).map(([k, label, tok]) =>
        [`var(${tok})`, label + (k === 'google' ? ' — traffic + indexation'
                               : k === 'bing' ? ' — traffic only'
                               : ' — visits, second basis')])
        .concat([['var(--brass-line)', 'Cache coverage — markers along the top']]))
    : view === 'monthly'
    ? ''
    : lineLegend([['var(--series-1)', false, 'High scenario'],
                  ['var(--series-1)', 'dot', 'Mid — the midpoint of low and high'],
                  ['var(--series-1)', true, 'Low scenario'],
                  ['var(--series-1)', 'block', 'Scenario range'],
                  ['var(--brass-line)', 'block', 'Cache coverage — markers along the top']]);

  const chart =
      view === 'engine'  ? (W => engineChart(W, D.cfg, tier))
    : view === 'monthly' ? (W => monthlyChart(W, D.cfg, tier))
    :                      (W => projectionChart(W, D.cfg));

  const tail =
      view === 'engine'  ? engineNote(D, tier)
    : view === 'monthly' ? monthlyNote(D, tier)
    :                      rampNote(D);

  // Revenue is the one unit search and AI share, so every view here now totals to the
  // headline. Clicks and visits are not comparable; dollars are.
  const aiCaveat = D.cfg.includeAi
    ? ' Revenue is in dollars, so AI is included and every view totals to the headline '
      + 'figure above — but search and AI inside it are counted in different ways.'
    : ' AI assistants are switched off, so these are search-only on a single basis.';
  return fig('Projection', note + aiCaveat, ctl + legendRow + chartSlot(GEO.h, chart) + tail);
}

// Answers the question the smooth cumulative curve provokes — "does this even use
// seasonality?" — with the two magnitudes side by side rather than a reassurance.
function monthlyNote(D, tier) {
  const m = D.monthly[tier];
  if (!m || m.length < 2) {
    return `<p class="note" style="margin:16px 0 0">The window is too short to show a
      month-over-month shape.</p>`;
  }
  const a = m[0], z = m[m.length - 1];
  const seasVals = m.map(r => r.seas);
  const sLo = Math.min.apply(null, seasVals), sHi = Math.max.apply(null, seasVals);
  const covLo = Math.min.apply(null, m.map(r => r.cov));
  const covHi = Math.max.apply(null, m.map(r => r.cov));
  return `<div class="callout">
    <p><strong>Seasonality is applied, and it is small — the ramp is doing the work.</strong>
    Across this window the blended seasonal index moves
    ${esc(sLo.toFixed(3))} to ${esc(sHi.toFixed(3))}, a
    <strong style="color:var(--ink)">${esc((sHi/sLo).toFixed(2))}&times;</strong> swing,
    while cache coverage moves ${esc(pct0(covLo))} to ${esc(pct0(covHi))} &mdash;
    <strong style="color:var(--ink)">${esc((covHi/(covLo || 1)).toFixed(0))}&times;</strong>.
    That is why the cumulative view looks like a smooth rise: it is a ramp curve with a
    few percent of seasonal texture on it, not a seasonal curve.</p>
    <p style="margin-top:10px">The index is flat <em>because</em> the base is
    ${esc(pct1(D.weights[1]))} anonymized-attributed, and anonymized traffic barely
    peaks at the holidays (November clicks 1.062 against non-branded 1.347). Applying
    non-branded seasonality to this base &mdash; which the original workbook did &mdash;
    borrowed a Q4 lift most of the base does not have. Bing is integrated on its own
    shape, and its December is the strongest of all three at 1.227.</p></div>`;
}

// What the engine split actually says, stated rather than left to be eyeballed.
function engineNote(D, tier) {
  if (!D.cfg.bing) {
    return `<p class="note" style="margin:16px 0 0"><strong style="color:var(--ink)">Bing is
      switched off</strong> in Model inputs, so the whole projection is Google. Turn
      &ldquo;Include Bing&rdquo; back on to see the split.</p>`;
  }
  const e = D.engines[tier];
  const drift = e.shareEnd - e.shareStart;
  return `<p class="note" style="margin:16px 0 0">Bing is
    <strong style="color:var(--ink)">${esc(pct1(e.shareEnd))}</strong> of the ${tier}
    scenario at the decision date &mdash; ${esc(fmtUSD(e.bing))} of ${esc(fmtUSD(e.total))}.
    The share is nearly identical in the other scenario, because Bing enters the model as
    a fixed click target per scenario rather than as a growth rate. It drifts from
    ${esc(pct1(e.shareStart))} to ${esc(pct1(e.shareEnd))} across the window
    &mdash; ${drift > 0 ? 'up' : 'down'} ${esc((Math.abs(drift) * 100).toFixed(1))}pp,
    because Bing’s December click seasonality (1.227) is stronger than Google’s
    blended December (1.167). Bing carries <em>no</em> indexation lever, so this is
    traffic against traffic-plus-indexation.</p>`;
}

function rampNote(D) {
  const t = D.cfg.rampWeeks;
  const b = D.bundle;
  return `<p class="note" style="margin:16px 0 0">Percentages along the top are the
    cache coverage live at that moment, read on the 30 / 60 / 90-day cadence and at the
    decision date. <strong style="color:var(--ink)">T1&ndash;T${D.trancheCount}</strong>
    mark when each batch of the cache goes live${t > 0 ? ` across the ${t}-week ramp-up` : ' (instant, all at once)'};
    each batch then builds up over <em>its own</em> 30, 60 and 90 days, so at any moment
    the batches are at different stages. The curve blends them day by day rather than
    jumping between fixed levels.</p>
    <div class="callout"><p><strong>Two coverage rows are not a range on coverage, and
    not the revenue band.</strong> &ldquo;Low&rdquo; and &ldquo;high&rdquo; each set
    <em>four things at once</em>: impression growth
    (${esc(pct0(D.cfg.growth.low))} vs ${esc(pct0(D.cfg.growth.high))}), the indexation
    lift (${esc(pct0(D.cfg.dial.low))} vs ${esc(pct0(D.cfg.dial.high))}), a Bing click
    target, and a cache ramp-up
    (${esc(b.curves.low.map(v => pct0(v)).join(' \u2192 '))} against
    ${esc(b.curves.high.map(v => pct0(v)).join(' \u2192 '))}). Coverage is an
    <em>input</em> to each case; revenue is the output. The four always move together
    &mdash; there is no version where the cache builds fast but growth stays low.</p>
    <p style="margin-top:10px">How fast the cache builds is the single biggest piece of
    that gap.
    Leaving everything else at low and speeding up only the cache build moves
    ${esc(fmtUSD(D.win.low.revenue))} to
    <strong style="color:var(--ink)">${esc(fmtUSD(b.lowOnFastRamp))}</strong>. That one
    change accounts for roughly
    ${esc(pct0(Math.log(b.rampX) / Math.log(b.spread)))} of the whole distance from low to
    high; impression growth, indexation lift and Bing together make up the rest.</p></div>`;
}

// Four drivers, not five rows. The first one splits by evidence, and presenting that
// split as two flat siblings alongside Indexation and Bing is what made this table
// unreadable — a flat list implies parallel things, and these are not parallel. The
// hierarchy is presentation only; the model still returns five numbers that sum.
function figLevers(D) {
  const lo = annualComposition(D.cfg, 'low', D.cfg.aiBasis);
  const hi = annualComposition(D.cfg, 'high', D.cfg.aiBasis);
  const get = (c, k) => c.rows.find(r => r.key === k) || {volume: 0, revenue: 0, share: 0};
  const c = D.cfg;
  const base = DATA.levels.measuredNonbrandImpr + DATA.levels.anonAssignedImpr * c.anon;
  const measuredShare = base ? DATA.levels.measuredNonbrandImpr / base : 1;

  // How each figure is actually produced, so a row can be checked rather than believed.
  const formula = {
    traffic: `${fmtC(base)} base impressions × ${pct0(c.growth.low)} growth `
      + `× ${(DATA.levels.nonbrandCtr * 100).toFixed(3)}% CTR`,
    traffic_measured: `${pct1(measuredShare)} of the base — impressions with a visible query`,
    traffic_anonymized: `${pct1(1 - measuredShare)} of the base — Google withholds the query`,
    indexation: `${fmtC(DATA.levels.poolCrawledNotIndexed)} pool × ${pct0(c.dial.low)} indexed `
      + `× ${c.clicksPerPage.toFixed(3)} clicks/page × new pages earning `
      + `${pct0(c.newPagePerf)} of a normal page`,
    bing: 'A fixed non-branded click target per scenario, not a growth rate',
    ai: `${fmtC(D.ai.riskAdjustedVisits)} risk-adjusted annual visits × `
      + `${pct0(TRAJ().ai.lift.low)} lift, at $${D.ai.rpv.toFixed(2)}/visit`,
  };

  const tLoV = get(lo, 'traffic_measured').volume + get(lo, 'traffic_anonymized').volume;
  const tLoR = get(lo, 'traffic_measured').revenue + get(lo, 'traffic_anonymized').revenue;
  const tHiR = get(hi, 'traffic_measured').revenue + get(hi, 'traffic_anonymized').revenue;
  const tShare = lo.totalRevenue ? tLoR / lo.totalRevenue : 0;

  const row = (r, opts) => {
    opts = opts || {};
    const h = get(hi, r.key);
    const swatch = r.hatch
      ? 'repeating-linear-gradient(45deg,var(--lv-bing) 0 2px,transparent 2px 4px)'
      : `var(${r.tok})`;
    return `<tr>
      <td style="${opts.child ? 'padding-left:26px;font-weight:400' : ''}">
        <span class="dot" style="background:${swatch}"></span>${esc(r.label)}
        <div style="font-weight:400;color:var(--ink-3);font-size:12.5px;margin-top:3px;
                    max-width:56ch">${esc(formula[r.key] || '')}</div></td>
      <td class="n">${esc(fmtC(r.volume))} <span style="color:var(--ink-3)">${r.unit}</span></td>
      <td class="n${opts.child ? '' : ' hi'}">${esc(fmtUSD(r.revenue))}</td>
      <td class="n">${esc(pct1(r.share))}</td>
      <td class="n${opts.child ? '' : ' hi'}">${esc(fmtUSD(h.revenue))}</td>
      <td class="g">${chip(r.gcls, r.grade)}</td>
    </tr>`;
  };

  const body =
    `<tr><td><span class="dot" style="background:var(--lv-measured)"></span>Google Growth
       <div style="font-weight:400;color:var(--ink-3);font-size:12.5px;margin-top:3px;
                   max-width:56ch">${esc(formula.traffic)}. <strong style="color:var(--ink-2)">One
       driver</strong> — the two rows below are the same clicks split by whether we can
       see the query that produced them.</div></td>
       <td class="n">${esc(fmtC(tLoV))} <span style="color:var(--ink-3)">clicks</span></td>
       <td class="n hi">${esc(fmtUSD(tLoR))}</td>
       <td class="n">${esc(pct1(tShare))}</td>
       <td class="n hi">${esc(fmtUSD(tHiR))}</td>
       <td class="g"></td></tr>`
    + row(get(lo, 'traffic_measured'), {child: true})
    + row(get(lo, 'traffic_anonymized'), {child: true})
    + row(get(lo, 'indexation'))
    + row(get(lo, 'bing'))
    + (c.includeAi ? row(get(lo, 'ai')) : '');

  return fig('Annual targets — what the number rests on',
    'Four things produce the growth. This is all of them, before any ramp, on '
    + 'one unit, with the arithmetic for each shown so a row can be checked rather than '
    + 'taken on trust.',
    `<div class="callout" style="margin:0 0 22px">
      <p><strong>1. It is annual and fully deployed — not the headline.</strong> It answers
      &ldquo;if SpeedWorkers ran at full coverage for a year, where would the revenue come
      from?&rdquo; That is
      <strong style="color:var(--ink)">${esc(fmtUSD(lo.totalRevenue))} &ndash;
      ${esc(fmtUSD(hi.totalRevenue))} a year</strong>. The headline
      ${esc(fmtUSD(D.win.low.revenue))} &ndash; ${esc(fmtUSD(D.win.high.revenue))} is the
      same number cut down twice &mdash; to the ${D.span}-day window, and by a ramp that
      only reaches ${esc(pct1(D.exit.low))} &ndash; ${esc(pct1(D.exit.high))} coverage by
      the decision date. The last row of the table shows that step explicitly.</p>
      <p style="margin-top:10px"><strong>2. Google Growth is one lever, shown as two rows.</strong>
      SpeedWorkers lifts non-branded impressions by ${esc(pct0(c.growth.low))}&ndash;${esc(pct0(c.growth.high))};
      those extra impressions convert at Walmart&rsquo;s non-branded CTR. That produces one
      pool of clicks. It is then split by where the underlying impressions came from &mdash;
      the ones with a visible query, and the ones Google anonymizes. <em>Same driver,
      different evidence.</em> Indexation, Bing Growth and AI Growth are genuinely separate
      from it, and from each other.</p>
      <p style="margin-top:10px"><strong>3. Everything is in revenue because the units differ.</strong>
      Search is counted in clicks, AI in Walmart&rsquo;s AEO visits, and those do not add up.
      Revenue is the only thing they share, so shares are computed on it. Native volume sits
      alongside and is never silently converted.</p>
      <p style="margin-top:10px"><strong>4. The shares are the whole point.</strong> Only
      <strong style="color:var(--ink)">${esc(pct1(get(lo, 'traffic_measured').share))}</strong>
      of the annual number comes from traffic where we can see the actual query.
      <strong style="color:var(--ink)">${esc(pct1(get(lo, 'traffic_anonymized').share))}</strong>
      comes from traffic Google hides the query for, which we apportion using the non-brand
      share of named traffic. That is the defensibility line, and it is why the
      measured-only floor above is the number to quote when pushed.</p>
    </div>`
    + legend(lo.rows.map(r => [r.hatch
        ? 'repeating-linear-gradient(45deg,var(--lv-bing) 0 3px,var(--surface) 3px 6px)'
        : `var(${r.tok})`, r.label]))
    + chartSlot(178, W => compositionBar(W, D.cfg))
    + `<div style="overflow-x:auto;margin-top:20px"><table class="mtable">
        <thead><tr><th>What drives it</th><th class="n">Annual volume</th>
          <th class="n">Annual rev &middot; low</th><th class="n">Share</th>
          <th class="n">Annual rev &middot; high</th>
          <th class="g">Evidence</th></tr></thead>
        <tbody>${body}</tbody>
        <tfoot><tr><td>Annual total, full coverage</td>
          <td class="n">${esc(fmtC(lo.searchClicks))} <span style="color:var(--ink-3)">search clicks</span></td>
          <td class="n">${esc(fmtUSD(lo.totalRevenue))}</td><td class="n">100.0%</td>
          <td class="n">${esc(fmtUSD(hi.totalRevenue))}</td>
          <td class="g"></td></tr>
          <tr><td style="font-weight:400;color:var(--ink-2)">&darr; cut to the pilot window
            <div style="color:var(--ink-3);font-size:12.5px;margin-top:3px">
              ${D.span} days instead of 365, and a ramp reaching only
              ${esc(pct1(D.exit.low))} / ${esc(pct1(D.exit.high))} coverage. This row IS
              the headline.</div></td>
            <td class="n">${esc(fmtC(D.win.low.clicks))} <span style="color:var(--ink-3)">search clicks</span></td>
            <td class="n hi">${esc(fmtUSD(D.win.low.revenue))}</td>
            <td class="n">${esc(pct1(lo.totalRevenue ? D.win.low.revenue / lo.totalRevenue : 0))}</td>
            <td class="n hi">${esc(fmtUSD(D.win.high.revenue))}</td>
            <td class="g"></td></tr>
      </table></div>`);
}

function figSensitivity(D) {
  // Anonymized inclusion first: it is the dominant lever by a wide margin, and the
  // slider's own position is always shown so the table says where you are as well
  // as what the alternatives would be.
  const stops = Array.from(new Set([0, 30, 50, 70, 100, S.anon])).sort((a, b) => a - b);
  const anonRows = stops.map(v => {
    const c = Object.assign({}, D.cfg, {anon: v / 100});
    const w = bucketWeights(c)[0];
    return `<tr class="${v === S.anon ? 'cur' : ''}">
      <td>${v}%${v === S.anon ? ' &nbsp;&larr; current' : ''}</td>
      <td class="n hi">${esc(fmtUSD(cumulative(c, 'clicks', 'low') * D.cfg.rpv))}</td>
      <td class="n">${esc(fmtUSD(cumulative(c, 'clicks', 'mid') * D.cfg.rpv))}</td>
      <td class="n hi">${esc(fmtUSD(cumulative(c, 'clicks', 'high') * D.cfg.rpv))}</td>
      <td class="n">${esc(pct1(w))}</td></tr>`;
  }).join('');

  // The ramp moves AI as well as search — SpeedWorkers serves AI crawlers on the same
  // coverage schedule — so this table carries AI and ties to the headline.
  const rampRow = (c, t) => {
    const p = revenueSeries(c, t, 'total', c.aiBasis, null, 7);
    return p.length ? p[p.length-1].v : 0;
  };
  const rampRows = [0, 1, 2, 3, 4, 5, 6].map(v => {
    const c = Object.assign({}, D.cfg, {rampWeeks: v});
    return `<tr class="${v === S.rampWeeks ? 'cur' : ''}">
      <td>${v === 0 ? 'Instant' : v + (v === 1 ? ' week' : ' weeks')}${v === S.rampWeeks ? ' &nbsp;&larr; current' : ''}</td>
      <td class="n hi">${esc(fmtUSD(rampRow(c, 'low')))}</td>
      <td class="n">${esc(fmtUSD(rampRow(c, 'mid')))}</td>
      <td class="n hi">${esc(fmtUSD(rampRow(c, 'high')))}</td></tr>`;
  }).join('');

  return fig('Sensitivity',
    'Where the answer actually comes from. Anonymized inclusion swings it by more than 4x; '
    + 'the ramp barely moves it. An input that does not change the answer is not worth '
    + 'arguing about in the room. '
    + 'The anonymized table is SEARCH ONLY: that lever is a pure search lever and does '
    + 'not touch AI, and the floor argument at 0% only holds while it stays single-basis. '
    + 'The ramp table does carry AI, because the ramp moves both — so it ties to the '
    + 'headline while the anonymized table sits below it.',
    `<p class="grp" style="margin-top:0">Anonymized inclusion &mdash; the dominant lever</p>
     <div style="overflow-x:auto"><table class="mtable">
       <thead><tr><th>Inclusion</th><th class="n">Revenue · low</th>
         <th class="n">Revenue · mid</th><th class="n">Revenue · high</th>
         <th class="n">Measured share of base</th></tr></thead>
       <tbody>${anonRows}</tbody></table></div>
     <p class="grp" style="margin-top:30px">Cache ramp-up${S.includeAi ? ' &mdash; includes AI' : ''}</p>
     <div style="overflow-x:auto"><table class="mtable">
       <thead><tr><th>Ramp</th><th class="n">Revenue · low</th>
         <th class="n">Revenue · mid</th><th class="n">Revenue · high</th></tr></thead>
       <tbody>${rampRows}</tbody></table></div>`);
}

// The extra surface: their year, with us and without us. Answers the question the
// incremental-only view cannot — "what happens anyway".
function figTrajectory(D) {
  const eng = S.trajEngine, t = D.traj[eng], spec = t.spec;
  const trendKey = {google: 'trendGoogle', bing: 'trendBing', ai: 'trendAi'}[eng];
  const isAi = eng === 'ai';

  const ctl = `<div class="ctl-row" style="margin:0 0 18px">
      <div class="ctl"><span class="lbl">Channel</span>
        ${seg('trajEngine', [['google','Google'],['bing','Bing'],['ai','AI'],
                             ['combined','Google + Bing']])}</div>
      <div class="ctl"><span class="lbl">Scenario</span>
        ${seg('trajTier', [['low','Low'],['mid','Mid'],['high','High']])}</div>
      ${isAi ? `<div class="ctl"><span class="lbl">AI baseline reading</span>
        ${seg('aiBasis', [['three_day_mean','3D · mean'],['three_day_w16','3D · W16 only'],
                          ['three_day_latest','3D · latest'],
                          ['same_session_mean','Same-session (floor)']])}</div>` : ''}
    </div>`;

  const trendCtl = trendKey ? slider(trendKey, 'Baseline trend, year on year',
      -30, 30, 0.5, (S[trendKey] > 0 ? '+' : '') + S[trendKey].toFixed(1) + '%',
      spec.trendNote.charAt(0).toUpperCase() + spec.trendNote.slice(1)
        + '. This describes the client’s own trajectory, not our intervention.')
    : `<p class="note" style="margin:0 0 16px">Google and Bing each carry their own
       trend — set them on their own tabs. There is no single combined trend, and
       averaging them would weight a 7% channel like a 93% one.</p>`;

  // Cards lead with the SAME-MONTH year-on-year comparison, because that is the
  // question — are they down — and because window totals sitting beside a per-month
  // chart is exactly what made the old version unreadable. Every card says its unit.
  const rows = trajectoryRows(D.cfg, eng, S.trajTier, D.trends);
  const last = rows.length ? rows[rows.length-1] : null;
  // The reference is the same calendar month a year before the FINAL month, not the
  // first month plotted. Comparing Dec against Nov would read seasonality as trend.
  const ref = last && last.prior ? last.prior : null;
  const refLabel = last ? MON[last.month-1] + ' ' + (last.year - 1) : '';
  const lastLabel = last ? MON[last.month-1] + ' ' + last.year : '';
  const vsRef = v => ref ? v / ref - 1 : null;
  const sign = x => (x >= 0 ? '+' : '') + pct1(x);

  const stats = ref && last ? `<div class="stats" style="margin-bottom:22px">
      ${statCard(refLabel + ' · actual', fmtC(ref),
        'Clicks that month, measured. The same calendar month a year before the last '
        + 'point, so the comparison carries no seasonality.', 'var(--ink)')}
      ${statCard(lastLabel + ' · without us', fmtC(last.baseline),
        sign(vsRef(last.baseline)) + ' against ' + refLabel + ', on their own trend',
        'var(--ink-3)')}
      ${statCard(lastLabel + ' · with Botify', fmtC(last.withUs),
        sign(vsRef(last.withUs)) + ' against ' + refLabel
          + (vsRef(last.withUs) < 0 ? ' — still below it' : ' — back above it'),
        'var(--brass-line)', true)}
      ${statCard('Our lift, over the window',
        '+' + fmtC(t.incremental) + (isAi ? ' visits' : ' clicks'),
        'Worth ' + fmtUSD(t.incremental * (isAi ? D.ai.rpv : D.cfg.rpv))
          + ' — ' + sign(t.deviation) + ' on a base of ' + fmtC(t.baseline)
          + ' ' + (isAi ? 'visits' : 'clicks') + '. This chart counts '
          + (isAi ? 'visits' : 'clicks') + ', not dollars; every other figure on the tab '
          + 'is in dollars.',
        'var(--lv-measured)')}
    </div>` : `<div class="stats" style="margin-bottom:22px">
      ${statCard('Without Botify', fmtC(t.baseline), 'Over the ' + t.rows.length
        + '-month window' + (isAi ? '. No history exists for this channel.' : ''),
        'var(--ink-3)')}
      ${statCard('With Botify', fmtC(t.withUs), '+' + fmtC(t.incremental)
        + ' incremental over the window', 'var(--brass-line)', true)}
      ${statCard('Deviation', '+' + pct1(t.deviation), 'Against a property-total base',
        'var(--lv-measured)')}
      ${statCard('Evidence',
        isAi ? D.ai.n + ' week' + (D.ai.n === 1 ? '' : 's') + ' of data' : 'Measured',
        isAi ? 'Two volatile weekly scorecards — a range, not a baseline'
             : 'Measured daily and stored, so it can be re-checked', 'var(--ink-3)')}
    </div>`;

  const note = isAi
    ? 'AI-referred visits, scaled from OpenAI to the full ecosystem. This is the '
      + 'thinnest evidence on the page and is kept out of the headline revenue figure '
      + 'entirely — it sits here so the channel is visible, not so it can be counted.'
    : 'Clicks per month: ' + (TRAJ().history[eng] || []).length + ' months of measured '
      + 'actuals, then the pilot window projected. Where a prior year is held it is drawn '
      + 'alongside, so the year-over-year gap is visible month by month rather than '
      + 'asserted. Both engines are counted as whole-site traffic, because that is the '
      + 'only form Bing\u2019s data comes in.';

  return fig('Trajectory — monthly CLICKS, with and without Botify', note,
    ctl + trendCtl
    + lineLegend([['var(--ink)', false, 'Actual — measured monthly clicks'],
                  ['var(--series-2)', true, 'Last year — same months, measured'],
                  ['var(--series-1)', false, 'With Botify — projected'],
                  ['var(--ink-3)', true, 'Without Botify — their own trend'],
                  ['var(--series-1)', 'block', 'The deviation']])
    + stats
    + chartSlot(444, W => trajectoryChart(W, D.cfg, eng, S.trajTier, D.trends))
    + headlineBridge(D, eng)
    + yoyNote(eng)
    + trajNote(D, eng));
}

function yoyNote(eng) {
  const y = TRAJ().yoy[eng];
  if (!y) {
    const why = eng === 'ai'
      ? 'AI has two weekly scorecards and no history at all, so there is nothing to '
        + 'compare year over year.'
      : 'The ingested Bing pull covers 365 days from 1 Aug 2025, so no Bing month has a '
        + 'complete counterpart twelve months earlier — and Combined inherits that gap. '
        + 'This is a collection gap, not a property of the data: the BWT source holds 514 '
        + 'days from 13 Mar 2025, so a re-pull would buy roughly five comparable months. '
        + 'Select Google to see the year-over-year comparison.';
    return `<div class="callout"><p><strong>No year-over-year available for this
      channel.</strong> ${why}</p></div>`;
  }
  const worse = y.accelerating;
  const rows = y.series.map(r =>
    `<tr><td>${MON[+r.ym.slice(5,7)-1]} ${r.ym.slice(0,4)}</td>
      <td class="n hi">${esc(fmtC(r.clicks))}</td>
      <td class="n">${esc(fmtC(r.prior_clicks))}</td>
      <td class="n hi" style="color:${r.change < 0 ? 'var(--flag)' : 'var(--ok)'}">
        ${r.change >= 0 ? '+' : ''}${esc(pct1(r.change))}</td></tr>`).join('');
  return `<div class="callout">
    <p><strong>Year to date, year over year: ${esc(pct1(y.ytd.change))} on clicks</strong>
    across ${y.months} comparable months (${esc(fmtC(y.ytd.clicks))} against
    ${esc(fmtC(y.ytd.prior_clicks))} the year before). Every month in the series is
    down.</p>
    ${worse ? `<p style="margin-top:10px"><strong style="color:var(--flag)">And it is
      accelerating.</strong> The last ${y.recentN} months run
      <strong style="color:var(--ink)">${esc(pct1(y.recent.change))}</strong> against
      ${esc(pct1(y.ytd.change))} for the full period, with the most recent month the
      worst of the series. The baseline trend control defaults to the twelve-month
      average, which on this evidence is the <em>optimistic</em> reading — set it nearer
      the recent rate to see the pessimistic case.</p>` : ''}
    <div style="overflow-x:auto;margin-top:14px"><table class="mtable">
      <thead><tr><th>Month</th><th class="n">Clicks</th><th class="n">Year before</th>
        <th class="n">Change</th></tr></thead><tbody>${rows}</tbody>
      <tfoot><tr><td>${y.months}-month total</td>
        <td class="n">${esc(fmtC(y.ytd.clicks))}</td>
        <td class="n">${esc(fmtC(y.ytd.prior_clicks))}</td>
        <td class="n" style="color:var(--flag)">${esc(pct1(y.ytd.change))}</td></tr></tfoot>
    </table></div></div>`;
}

// Whichever channel is selected, close the loop to the headline. Without this the
// trajectory shows a channel-specific figure — Google alone is $6.96M against a $7.99M
// headline — and the reader is left to guess whether the difference is an error.
function headlineBridge(D, eng) {
  const t = S.trajTier;
  const rpv = D.cfg.rpv, air = D.ai.rpv;
  const parts = [
    {key: 'google', label: 'Google', v: D.traj.google.incremental * rpv, unit: 'clicks'},
    {key: 'bing', label: 'Bing', v: D.traj.bing.incremental * rpv, unit: 'clicks'},
  ];
  const search = D.win[t].search;
  const ai = D.cfg.includeAi ? D.win[t].ai : 0;
  const rows = parts.map(p => `<tr class="${p.key === eng ? 'cur' : ''}">
      <td>${esc(p.label)}${p.key === eng ? ' &nbsp;&larr; this chart' : ''}</td>
      <td class="n">${esc(fmtC(D.traj[p.key].incremental))} clicks</td>
      <td class="n hi">${esc(fmtUSD(p.v))}</td></tr>`).join('');
  return `<div class="callout" style="margin:14px 0 0">
    <p><strong>Where this sits in the headline.</strong> The chart shows one channel at a
    time, so its figure is a part, not the whole. The ${esc(t)} headline is built like this:</p>
    <div style="overflow-x:auto;margin-top:12px"><table class="mtable">
      <thead><tr><th>Channel</th><th class="n">In-window volume</th>
        <th class="n">Revenue</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>Search subtotal</td>
        <td class="n">${esc(fmtC(D.win[t].clicks))} clicks</td>
        <td class="n">${esc(fmtUSD(search))}</td></tr>
        ${D.cfg.includeAi ? `<tr class="${eng === 'ai' ? 'cur' : ''}">
          <td style="font-weight:400;color:var(--ink-2)">AI assistants${eng === 'ai' ? ' &nbsp;&larr; this chart' : ''}
            <div style="color:var(--ink-3);font-size:12.5px;margin-top:3px">Visits at
              $${esc(air.toFixed(2))}, counted a different way</div></td>
          <td class="n">${esc(fmtC(D.win[t].aiVisits))} visits</td>
          <td class="n">${esc(fmtUSD(ai))}</td></tr>` : ''}
        <tr><td><strong>Headline, ${esc(t)}</strong></td><td class="n"></td>
          <td class="n hi">${esc(fmtUSD(D.win[t].revenue))}</td></tr>
      </table></div></div>`;
}

function trajNote(D, eng) {
  const t = D.traj[eng], nb = TRAJ().nonbrandShareOfCombined;
  if (eng === 'ai') {
    const a = D.ai, A = TRAJ().ai;
    const weeks = A.weeks.map(w => {
      const b = w[a.kind] || w.three_day;
      return `${esc(w.week)} ${esc(fmtC(b.visits))} visits / ${esc(fmtUSD(b.gmv))}`
        + (b.attested === false ? ' (derived)' : '');
    }).join(' &middot; ');
    return `<div class="callout">
      <p><strong>This rests on ${a.n === 1 ? 'one weekly reading' : a.n + ' weekly readings'},
      on the ${a.kind === 'three_day' ? '3-day attribution' : 'same-session'} basis.</strong>
      ${weeks}. Walmart flagged both weeks volatile pending OpenAI feed
      indexation, completed 15 Jun 2026, and W17 fell 19% on visits with the decline
      continuing into the following week. Annualising either week alone is a run-rate
      on a single point.</p>
      <p style="margin-top:10px">Chain: ${esc(fmtC(a.weeklyVisits))} weekly OpenAI visits
      &rarr; &times;52 &rarr; &times;${esc(A.ecosystem.toFixed(2))} to the full ecosystem
      (ChatGPT is ~90% of AI referral traffic) &rarr; &times;${esc(pct0(A.risk))} risk
      haircut &rarr; ${esc(fmtC(a.riskAdjustedVisits))} risk-adjusted annual visits
      &rarr; &times;${esc(pct0(A.lift.low))}/${esc(pct0(A.lift.high))} lift. AI revenue
      per visit is $${esc(a.rpv.toFixed(2))} on this basis.</p>
      <p style="margin-top:10px"><strong>An AI visit is worth about
      ${esc(aiPremium().toFixed(2))}&times; a search visit</strong>, and this is the one AI
      figure that does not depend on resolving the attribution question. Each scorecard
      states AI as a share of SEO <em>visits</em> and as a share of SEO <em>GMV</em> in the
      same sentence, so the ratio is basis-independent: W16 gives 11.2/5.3 = 2.11&times;,
      W17 gives 11.0/4.6 = 2.39&times;. Use this in the room, not the absolute GMV.</p>
      <p style="margin-top:10px"><strong>Units do not reconcile, and should not be forced
      to.</strong> Walmart&rsquo;s SEO visit count is ~30M/week against
      ${esc(fmtC(TRAJ().engines.combined.total / 52))}/week of Google + Bing clicks in our
      archive &mdash; about 2&times;. Different measurement systems. Any figure that sums
      AI and search spans both, and is labelled as doing so.</p>
      <p style="margin-top:10px"><strong>Why 3-day attribution is the default.</strong> The
      scorecard email headlines a narrower pair (W16: 1.0M visits / $7.2M) than the workbook's
      AI tab uses (1.6M / $13.1M), and the plan asserted the workbook had mislabelled them.
      It had not. Four checks settle it, all ratios inside a single basis: against the
      scorecard's own 130,000 weekly orders, 1.6M/$13.1M gives AOV
      <strong style="color:var(--ink)">$100.77</strong> and CR
      <strong style="color:var(--ink)">8.12%</strong> against the reported $101 and 8.3%,
      while 1.0M/$7.2M gives $55.38 and 13.0%. And the email's own stated shares (5.3% of SEO
      visits, 11.2% of GMV) reconcile 1.6M and $13.1M to the 30.0M / $117.3M SEO totals, but
      not the smaller pair. 3D is also what Walmart's AEO channel reports on and what every
      other channel in the scorecard is measured against. Same-session is kept as a floor.</p>
      <p style="margin-top:10px"><strong>The risk haircut is applied once here.</strong>
      The workbook applies it twice — its &ldquo;Annual All-AI Visits&rdquo; row already
      contains the 80% while being labelled as ecosystem-scaling only, then haircuts it
      again. That makes its lift base 0.64&times; rather than 0.80&times;, understating
      its own AI figure by 20%. No seasonality is applied to AI at all: there is no AI
      seasonal history to measure.</p></div>`;
  }
  // The single most misread thing on this chart: a 2% gap against a property total is
  // not the same claim as a 2% gap against the traffic the lift acts on. Both are given.
  const den = TRAJ().liftDenominators.google;
  const annualLift = D.ann.levers.low.traffic_measured + D.ann.levers.low.traffic_anonymized
                     + D.ann.levers.low.indexation;
  // These are trajectory() rows: {held, baseline, incremental}. `withUs` exists only on
  // trajectoryRows(), which the chart builds — reading it here yielded NaN and printed
  // "+— clicks". The gain per month IS `incremental`.
  // A decision date on or before launch produces no months at all, so nothing here may
  // index the last row without checking for it first.
  const lastRow = t.rows.length ? t.rows[t.rows.length-1] : null;
  const perMonth = t.rows.length ? t.baseline / t.rows.length : 0;
  const lastGain = lastRow ? lastRow.incremental : 0;
  const scopeLine = `<div class="callout" style="margin:14px 0 0">
    <p><strong>This chart counts clicks, not dollars.</strong> The two endpoint figures are
    monthly <em>clicks</em> &mdash; ${lastRow ? esc(fmtC(lastRow.baseline + lastRow.incremental))
    + ' against ' + esc(fmtC(lastRow.baseline)) : 'two totals'} in the final month. The gap
    between them is
    <strong style="color:var(--ink)">${esc(fmtC(lastGain))} clicks</strong>, which at
    $${esc(D.cfg.rpv.toFixed(2))} revenue per click is
    <strong style="color:var(--ink)">${esc(fmtUSD(lastGain * D.cfg.rpv))}</strong> in that
    month alone. Across the whole window it is ${esc(fmtC(t.incremental))} clicks, or
    ${esc(fmtUSD(t.incremental * D.cfg.rpv))}
    ${eng === 'combined' ? '&mdash; which is the search half of the headline' : ''}.</p>
    <p style="margin-top:10px">The axis stays in clicks on purpose. The baseline is their
    <em>property total</em>, which includes branded and anonymized traffic, and the only
    conversion rate we have from Walmart is the <em>non-branded</em> one &mdash; pricing
    their branded traffic with it would be wrong. Our increment is non-branded, so it can
    be priced, and it is.</p>
    <p style="margin-top:10px"><strong>Why the two lines look almost identical &mdash; and why that is not the
    whole story.</strong> The axis is their <em>property total</em>: every query, branded
    and anonymized, ${esc(fmtC(perMonth))} clicks in an average month. Our lift is
    <em>non-branded only</em>${lastRow ? `, so in the final month it is
    <strong style="color:var(--ink)">+${esc(fmtC(lastRow.incremental))}
    clicks</strong>` : ''} &mdash; against a base that size, a couple of per cent. Both
    numbers are true; only one of them is a fair measure of the lever.</p>
    ${eng === 'google' && den && den.matched ? `<p style="margin-top:10px">Stated against
      the base the model actually grows &mdash; non-branded plus the anonymized share the
      forecast claims, ${esc(fmtC(den.matched))} clicks a year &mdash; the annual lift is
      <strong style="color:var(--ink)">${esc(pct1(annualLift / den.matched))}</strong>, not
      ${esc(pct1(annualLift / den.property_total))}. Against <em>named</em> non-branded
      alone (${esc(fmtC(den.named_nonbrand))}) it would read
      ${esc(pct1(annualLift / den.named_nonbrand))}, which is why that denominator is not
      used: it silently drops the anonymized traffic the lift is mostly made of.</p>` : ''}
    <p style="margin-top:10px">The axis stays on property total because it is the only
    scope Bing has data for and the only one where a combined figure is legitimate.
    Adding Google non-branded to Bing&rsquo;s whole-site total would be mixing two
    different scopes, which is the one comparison this chart exists to avoid.</p></div>`;
  const trendLine = t.trendDelta < 0
    ? `<p><strong>Their trajectory is down, not flat.</strong>
       ${esc(TRAJ().engines[eng].label)} is on a
       ${esc(pct1(Math.abs(t.trendDelta / (t.held || 1))))} effective decline &mdash;
       computed from the window itself rather than read off one engine's slider, because
       for Combined the two engines carry different trends and Bing's is flat &mdash;
       which costs ${esc(fmtC(Math.abs(t.trendDelta)))} clicks across this
       ${t.rows.length}-month window.
       The ${esc(S.trajTier)} case returns ${esc(fmtC(t.incremental))}, which is
       <strong style="color:var(--ink)">${esc(pct1(t.offset))}</strong> of what the trend
       takes away. Impressions are rising while clicks fall, which is CTR compression,
       not lost demand.</p>`
    : `<p><strong>No decline is assumed for this channel.</strong> The trend is set to
       ${esc(pct1(S[{google:'trendGoogle',bing:'trendBing'}[eng] || 'trendBing'] / 100))},
       so the baseline is a flat run-rate and the whole deviation is incremental.
       ${eng === 'bing' ? 'Bing holds only 365 days, so there is no comparable second year to measure a trend from.' : ''}</p>`;
  return `<div class="callout">${trendLine}${scopeLine}</div>`;
}

// A compact read-out of the settings that actually move the answer, so collapsing the
// inputs column never hides an assumption — it only hides the controls for it.
function inputsSummary(D) {
  const bits = [
    ['info', pct0(D.cfg.anon) + ' anonymized'],
    ['plain', (D.cfg.rampWeeks === 0 ? 'instant cache' : D.cfg.rampWeeks + '-week cache ramp')
      + ' \u00b7 ' + D.cfg.tranches + ' update' + (D.cfg.tranches === 1 ? '' : 's')],
    ['plain', pct0(D.cfg.growth.low) + '–' + pct0(D.cfg.growth.high) + ' growth'],
    ['plain', pct0(D.cfg.dial.low) + '–' + pct0(D.cfg.dial.high) + ' indexation lift'],
    ['plain', 'RPV $' + D.cfg.rpv.toFixed(2)],
    [D.cfg.bing ? 'ok' : 'block', 'Bing ' + (D.cfg.bing ? 'in' : 'out')],
    [D.cfg.includeAi ? 'wait' : 'block', D.cfg.includeAi
      ? 'AI in · ' + (D.ai.kind === 'three_day' ? '3-day' : 'same-session')
        + ' · ' + D.ai.n + ' week' + (D.ai.n === 1 ? '' : 's')
      : 'AI out'],
  ];
  return `<div class="sum">${bits.map(([c, t]) => chip(c, t)).join('')}</div>`;
}

function inputsBar(D) {

// Provenance. Every figure on this tab traces to one of these rows, and the grade says
// how hard each one is: measured = read from a system of record over a stated window,
// capture = a number read off a console screen on a date, reported = the client told us
// and we cannot audit it, assumed = a scenario input with nothing measured behind it.
// Rows come from DATA.sources (forecast.py's SOURCES) so no value is retyped here.
const GRADE = {
  measured: ['ok',    'Measured'],
  capture:  ['info',  'Read from console'],
  reported: ['wait',  'Client-reported'],
  assumed:  ['block', 'Assumption'],
};

function figSources(D) {
  const groups = (DATA.sources || []).map(g => {
    const rows = g.rows.map(r => {
      const [tone, label] = GRADE[r.grade] || ['plain', r.grade];
      return `<tr>
        <td>${esc(r.input)}</td>
        <td class="n hi">${esc(r.value)}</td>
        <td style="font-weight:400;color:var(--ink-2)">${esc(r.source)}</td>
        <td style="font-weight:400;color:var(--ink-3);white-space:nowrap">${esc(r.window)}</td>
        <td style="font-weight:400">${chip(tone, label)}</td></tr>`;
    }).join('');
    return `<tr><td colspan="5" class="grp-row">${esc(g.group)}</td></tr>` + rows;
  }).join('');

  const counts = {};
  (DATA.sources || []).forEach(g => g.rows.forEach(r => {
    counts[r.grade] = (counts[r.grade] || 0) + 1;
  }));
  const tally = Object.keys(GRADE).filter(k => counts[k])
    .map(k => chip(GRADE[k][0], counts[k] + ' ' + GRADE[k][1].toLowerCase())).join('');

  return fig('Where every number comes from',
    'One row per input the projection consumes, with the system it was read from and how ' +
    'hard the evidence is. Nothing on this tab is computed from anything not listed here.',
    `<div class="hrow" style="margin:0 0 18px">${tally}</div>
     <div style="overflow-x:auto"><table class="mtable">
       <thead><tr><th>Input</th><th class="n">Value</th><th>Source</th>
         <th>Window</th><th>Evidence</th></tr></thead>
       <tbody>${groups}</tbody></table></div>
     <div class="callout" style="margin:18px 0 0"><p><strong>Every row here is read from
     somewhere outside this model</strong> &mdash; Google, Bing, or Walmart&rsquo;s own
     reporting &mdash; with the date or window it was read for. Nothing in the table is a
     number anyone chose.</p>
     <p style="margin-top:10px">The assumptions are deliberately <em>not</em> listed, because
     they are not sources: they are controls, in <strong>Model inputs</strong> on the left,
     each with a note explaining what it does. That is also where they belong, since they can
     be moved. The one to challenge is <strong>indexation lift</strong> &mdash; at its high
     end it assumes Google&rsquo;s index of the site nearly doubles inside the pilot window.</p>
     <p style="margin-top:10px">Two controls scale <em>every</em> revenue figure on this tab:
     average order value and conversion rate. Both came from the ROI workbook rather than
     Walmart&rsquo;s own reporting and have never been checked against it, so they are worth
     confirming before any of this is quoted externally.</p></div>`);
}

// ═══ Framework tab ══════════════════════════════════════════════════════════
// The roadmap: what gets measured, when each stage can answer, and what the window
// can and cannot prove. Every figure here is GENERATED from STAGES, METRICS and
// DATA.sources — nothing is retyped, so a stage tab and its roadmap row cannot
// disagree. That is the whole reason this surface is safe to put in front of the
// measurement it describes.

// When each stage first produces a signal worth reading, in launch-relative days.
// Deployment is 0 because health is instantaneous — a property of the metric, not a guess.
// Readiness is DERIVED from the crawl cadence: nothing can move until a second crawl
// exists to compare against, so it follows CRAWL_CADENCE_DAYS rather than being chosen.
//
// The last three ARE our own planning estimates and are labelled as such on the surface.
// An earlier draft attributed them to "a comparable retailer already running this" — the
// reference account's post-launch actuals have NOT been pulled (PLAN §11 #3), so that
// sentence claimed provenance nobody had read. Pulling them would replace these with
// observed values here and the interpolated ramp everywhere else.
const CRAWL_CADENCE_DAYS = 14;
const SIGNAL_DAYS = {
  deployment: 0,
  readiness:  CRAWL_CADENCE_DAYS,
  visibility: 30,
  engagement: 60,
  outcome:    90,
};

// ISO date arithmetic. dayNum() gives days-since-epoch; this is its inverse, so the whole
// roadmap can work in real dates instead of launch-relative day counts. Built from UTC
// throughout — a viewer behind UTC would otherwise see every milestone slip a day.
const isoFromDay = n => new Date(n * DAY).toISOString().slice(0, 10);
const shiftDays = (iso, n) => isoFromDay(dayNum(iso) + n);
const fmtShort = iso => +iso.slice(8, 10) + ' ' + MON[+iso.slice(5, 7) - 1];
const WINDOW_MARK = {
  prove:   ['ok',    'Provable in window'],
  partial: ['wait',  'Partly provable'],
  no:      ['block', 'Not provable in window'],
};

function frameworkData() {
  const cfg = cfgFromState();
  const span = Math.round((s2d(cfg.decision) - s2d(cfg.launch)) / DAY);
  // The chart's domain opens BEFORE launch. The binding deadline of this pilot is the
  // pre-launch baseline freeze — the one date that can still be missed — and a roadmap
  // starting on launch day leaves it off the page entirely.
  const t0 = Math.min(dayNum(S.today), dayNum(cfg.launch));
  const t1 = dayNum(cfg.decision);
  const rows = CHAIN.map(k => {
    const s = STAGE[k];
    const M = METRICS[k] || [];
    const day = Math.min(SIGNAL_DAYS[k], span);
    return {k, s, span, day, startISO: shiftDays(cfg.launch, day),
            estimated: !(k === 'deployment' || k === 'readiness'),
            metrics: M.length};
  });
  const specified = rows.reduce((a, r) => a + r.metrics, 0);
  return {cfg, span, rows, specified, t0, t1,
          preDays: dayNum(cfg.launch) - t0,
          today: S.today, live: dayNum(S.today) >= dayNum(cfg.launch)};
}

// The roadmap chart. Rows are stages, each bar running from the day that stage first
// produces a readable signal to the decision date, with the milestone verticals shared
// across all of them. A Gantt rather than a line because the quantity being shown is
// AVAILABILITY over time, not a magnitude — there is no y-value to plot.
// Axis is in REAL DATES, not launch-relative days, and the domain opens before launch so
// the baseline-freeze deadline is on the page. Everything derives from the model's launch
// and decision inputs: move the launch date and every mark here moves with it, while the
// decision date stays put and the window simply gets shorter.
function timelineChart(W, D) {
  const PL = 132, PR = 116, PT = 60, RowH = 52;
  const readouts = readoutList(D.cfg, D.span);
  const cW = Math.max(120, W - PL - PR);
  const dom = Math.max(1, D.t1 - D.t0);
  const H = PT + D.rows.length * RowH + 60;
  const pxD = n => PL + ((n - D.t0) / dom) * cW;          // days-since-epoch -> x
  const px = iso => pxD(dayNum(iso));
  const rowsBot = PT + D.rows.length * RowH;
  let o = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
    aria-label="Measurement roadmap from ${esc(fmtDay(isoFromDay(D.t0)))} to
    ${esc(fmtDay(D.cfg.decision))}: when each stage begins producing a readable signal.">`;

  // The pre-launch band. Shaded rather than merely marked, because "we are here and the
  // baseline is not frozen" is the single most actionable thing on this chart today.
  if (D.preDays > 0) {
    o += `<rect x="${pxD(D.t0).toFixed(1)}" y="${PT - 22}" width="${(px(D.cfg.launch) - pxD(D.t0)).toFixed(1)}"
      height="${rowsBot - PT + 22}" fill="var(--surface-sunk)"/>`;
    const midX = (pxD(D.t0) + px(D.cfg.launch)) / 2;
    o += `<text x="${midX.toFixed(1)}" y="${rowsBot + 17}" text-anchor="middle" font-size="10"
      font-weight="700" letter-spacing=".12em" fill="var(--ink-3)">PRE-LAUNCH</text>`;
  }

  // Milestones, all as dates. Same priority-and-collision rule as the projection's
  // coverage strip: lines always draw, only the label yields.
  const tr = trancheList(D.cfg);
  const cands = [
    {iso: D.cfg.launch,   label: 'LAUNCH',   kind: 'edge'},
    {iso: D.cfg.decision, label: 'DECISION', kind: 'edge'},
    ...(dayNum(S.today) >= D.t0 && dayNum(S.today) <= D.t1
        ? [{iso: S.today, label: 'TODAY', kind: 'today'}] : []),
    ...[30, 60, 90].filter(d => d <= D.span)
        .map(d => ({iso: shiftDays(D.cfg.launch, d), label: d + 'd', kind: 'ms'})),
    ...tr.map(([off], i) => ({iso: shiftDays(D.cfg.launch, off), label: 'T' + (i + 1), kind: 'tranche'}))
        .filter(m => dayNum(m.iso) <= D.t1),
  ];
  const placed = [];
  cands.forEach(m => {
    m.x = px(m.iso);
    m.showLabel = !placed.some(p => Math.abs(p - m.x) < 34);
    if (m.showLabel) placed.push(m.x);
  });
  cands.forEach(m => {
    const x = m.x.toFixed(1);
    const strong = m.kind === 'edge' || m.kind === 'today';
    o += `<line x1="${x}" y1="${PT - 22}" x2="${x}" y2="${rowsBot}"
      stroke="${m.kind === 'today' ? 'var(--brass)' : strong ? 'var(--ink-3)' : 'var(--rule)'}"
      stroke-width="${strong ? 1.4 : 1}"
      stroke-dasharray="${m.kind === 'tranche' ? '2 4' : m.kind === 'ms' ? '4 4' : 'none'}"/>`;
    if (!m.showLabel) return;
    const col = m.kind === 'today' ? 'var(--brass)' : strong ? 'var(--ink)' : 'var(--ink-3)';
    // Name above, DATE below it — the date is the thing that was asked for, so it is not
    // relegated to a tooltip or an axis somewhere else.
    o += `<text x="${x}" y="${PT - 42}" text-anchor="middle" font-size="10"
      font-weight="700" letter-spacing=".12em" fill="${col}">${esc(m.label.toUpperCase())}</text>
      <text x="${x}" y="${PT - 29}" text-anchor="middle" font-size="11" font-weight="${strong ? 700 : 400}"
      fill="${m.kind === 'today' ? 'var(--brass)' : 'var(--ink-2)'}">${esc(fmtShort(m.iso))}</text>`;
  });

  D.rows.forEach((r, i) => {
    const y = PT + i * RowH, bh = 15, by = y + (RowH - bh) / 2 - 4;
    const x0 = px(r.startISO), x1 = px(D.cfg.decision);
    const fill = r.s.window === 'prove' ? 'var(--lv-measured)'
               : r.s.window === 'partial' ? 'var(--lv-index)' : 'var(--series-mute)';
    o += `<text x="${PL - 14}" y="${by + 12}" text-anchor="end" font-size="12.5"
      font-weight="700" fill="var(--ink)">${esc(r.s.label)}</text>`;
    // The wait between launch and first signal, drawn so the DELAY is visible rather than
    // implied by where the bar happens to start.
    if (r.day > 0) {
      o += `<line x1="${px(D.cfg.launch).toFixed(1)}" y1="${(by + bh / 2).toFixed(1)}"
        x2="${x0.toFixed(1)}" y2="${(by + bh / 2).toFixed(1)}"
        stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="2 3"/>`;
    }
    o += `<rect class="stagebar" x="${x0.toFixed(1)}" y="${by}" width="${Math.max(2, x1 - x0).toFixed(1)}"
      height="${bh}" rx="2.5" fill="${fill}" opacity="${r.s.window === 'no' ? .5 : .92}"/>`;
    // Each bar is labelled with the DATE it starts, not a day number.
    o += `<text x="${(x1 + 10).toFixed(1)}" y="${by + 12}" font-size="10.5" font-weight="700"
      letter-spacing=".04em" fill="var(--ink-3)">${esc(fmtShort(r.startISO).toUpperCase())}</text>`;
    // Readout for this stage: a diamond on its own row, with the date under it.
    const ro = readouts.find(x => x.k === r.k);
    if (ro) {
      const rx = px(ro.iso), cy = by + bh / 2;
      o += `<path d="M${rx.toFixed(1)},${(cy - 7).toFixed(1)} L${(rx + 7).toFixed(1)},${cy.toFixed(1)}
        L${rx.toFixed(1)},${(cy + 7).toFixed(1)} L${(rx - 7).toFixed(1)},${cy.toFixed(1)} Z"
        fill="var(--bg)" stroke="var(--ink)" stroke-width="1.6"/>
        <text x="${rx.toFixed(1)}" y="${(by + bh + 15).toFixed(1)}" text-anchor="middle"
        font-size="10" font-weight="700" fill="var(--ink-2)">${esc(fmtShort(ro.iso))}</text>`;
    }
  });

  return o + '</svg>';
}

// A key that DRAWS its marks. The readout diamonds went out unexplained and read as
// decoration; a legend that says "diamond" in prose is not a legend.
function roadmapKey() {
  const mk = inner => `<svg viewBox="0 0 26 14" aria-hidden="true">${inner}</svg>`;
  const items = [
    [mk(`<rect x="0" y="4" width="26" height="7" rx="2" fill="var(--lv-measured)" opacity=".92"/>`),
     'Stage is producing a signal'],
    [mk(`<line x1="0" y1="7.5" x2="26" y2="7.5" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="2 3"/>`),
     'Live, but nothing to read yet'],
    [mk(`<path d="M13,1 L20,7.5 L13,14 L6,7.5 Z" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.6"/>`),
     'Proposed readout for that stage'],
    [mk(`<rect x="0" y="0" width="26" height="14" fill="var(--surface-sunk)"/>`),
     'Before launch — baseline freeze'],
    [mk(`<line x1="13" y1="0" x2="13" y2="14" stroke="var(--brass)" stroke-width="1.4"/>`),
     'Today'],
  ];
  return `<div class="ckey">` + items.map(([m, l]) =>
    `<span>${m}${esc(l)}</span>`).join('') + `</div>`;
}

function figRoadmap(D) {
  const est = D.rows.filter(r => r.estimated).map(r => r.s.label).join(', ');
  const freeze = D.preDays > 0
    ? `<div class="callout" style="margin:0 0 18px"><p><strong>${D.preDays} days until launch,
       and the pre-launch baseline is the deadline that can still be missed.</strong> Nothing on
       this roadmap can show a change without a frozen &ldquo;before&rdquo; &mdash; non-branded
       performance per page type, index coverage, and the render baseline, all captured and
       agreed before ${esc(fmtDay(D.cfg.launch))}. It is the only item here with no second
       chance: the window it measures will have passed.</p></div>`
    : '';
  const stats = `<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
                              margin:0 0 20px">

       with it; the decision date holds, so the window shortens rather than sliding. Deployment
       reports from day one because health is immediate, and Readiness follows the
       ${CRAWL_CADENCE_DAYS}-day crawl cadence because nothing can be compared until a second
       crawl exists.</p>

       <strong>our planning estimates</strong>, not measurements of this site and not yet
       calibrated against a comparable account &mdash; they are the least certain thing on this
       page and the first thing we would revise with observed data.</p>`);

// One stage at a time. The five-row table carried five stages' worth of prose at once and

// Stage readouts. Launch-relative so they move with the launch date, and clamped to stay
// inside the window: the outcome readout has to land before the decision, not on top of it.
// Dates are a PROPOSAL until the account team signs off on the cadence.
const READOUTS = [
  ['deployment', 14,  'Deployment readout'],

// ═══ render ═════════════════════════════════════════════════════════════════
// The slide-in must animate on OPEN and never again: render() re-runs on every slider
// input, and an animation left on the class would replay on each frame of a drag.
let panelJustOpened = false;
// A slider drag rebuilds the drawer's DOM, so its scroll offset has to be carried
// across or the panel snaps back to the top mid-drag.
let panelScroll = 0;

function render() {
  const openDrawer = document.querySelector('[data-drawer]');
  if (openDrawer) panelScroll = openDrawer.scrollTop;
  resetCharts();                       // mandatory: specs are closures over state
  const s = STAGE[S.tab];
  const body =
      S.tab === 'forecast'  ? tabForecast()
    : S.tab === 'framework' ? tabFramework()
    : S.tab === 'sources'   ? tabSources()
    : tabStage(s);
  document.getElementById('app').innerHTML =
    disclaimer() + masthead() + `<main class="wrap">` + shead(s) + body + devbar() + `</main>`;
  mountCharts();                       // measured width, so only after it is in the DOM
  const drawer = document.querySelector('[data-drawer]');
  if (drawer) {
    drawer.scrollTop = panelScroll;
    if (panelJustOpened) drawer.focus({preventScroll: true});
  }
  panelJustOpened = false;
}

// ═══ events ═════════════════════════════════════════════════════════════════
const app = document.getElementById('app');

app.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab && !tab.disabled) { S.tab = tab.dataset.tab; render(); return; }
  if (e.target.closest('[data-open-panel]')) {
    S.panelOpen = true;
    panelJustOpened = true;
    panelScroll = 0;
    render();
    return;
  }
  if (e.target.closest('[data-close-panel]')) {
    closePanel();
    return;
  }
  const fw = e.target.closest('[data-fwstage]');
  if (fw) { S.fwStage = fw.dataset.fwstage; render(); return; }
  const sg = e.target.closest('[data-seg]');
  if (sg) {
    S[sg.dataset.seg] = sg.dataset.val;
    // a gate change can lock the tab you are standing on
    if (isLocked(S.tab)) S.tab = 'forecast';
    render();
  }
});

app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.slider) {
    const k = t.dataset.slider;
    S[k] = parseFloat(t.value);
    render();
    const el = document.getElementById('sl-' + k);
    if (el) el.focus({preventScroll:true});
    return;
  }
  if (t.dataset.date) { S[t.dataset.date] = t.value; render(); return; }
  if (t.dataset.chk)  { S[t.dataset.chk] = t.checked; render(); }
});

function closePanel() {
  if (!S.panelOpen) return;
  S.panelOpen = false;
  render();
  // Send focus back to something that opened it, rather than dropping it on <body>.
  const back = document.querySelector('[data-open-panel]');
  if (back) back.focus({preventScroll: true});
}

// Escape closes the flyout — a modal that can only be dismissed by pointer is a trap
// for anyone driving this from the keyboard.
addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.panelOpen) { e.preventDefault(); closePanel(); }
});

// Charts size to their measured slot, so a resize needs a remount but not a
// re-render — the specs still hold, only the width changed.
let rsz;
addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(mountCharts, 120); });

render();
</script>

</body></html>
