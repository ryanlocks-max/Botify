<!--
  Botify · Walmart pilot measurement framework.

  The FORECAST tab is live: every control recomputes the model in the browser.

<style>/* Host Grotesk — Botify's deck-approved display/body face.
 *
 * VARIABLE font: one file per subset carries the whole wght axis (300-800), so a
 * single @font-face serves both body 400 and display 700 as REAL weights. Declare
 * the RANGE `font-weight: 300 800` — pinning a single value makes the browser
 * synthesize fake bold at 700, which looks worse than the Arial fallback.
 *
 * Embedded as data: URIs. This works under the artifact CSP: the CSP blocks
 * requests to external HOSTS (fonts.gstatic.com), not inline data. Verified in the
 * shipped AI Visibility report.
 *
 * Source: fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;700
 * Fetched 2026-08-10, Google Fonts v5. Latin ~20KB + latin-ext ~12KB on the wire.
 */
/* latin */

  font-family: 'Host Grotesk';
  font-style: normal;

<style>
  :root {
    color-scheme: light dark;
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-sunk:#F4F2FA;
    --ink:#0B0911; --ink-2:#4A4557; --ink-3:#7C7689;
    --rule:#E8E4F2; --rule-soft:#F1EFF8;
    --brass:#7A47CC; --brass-line:#A973FF;
    --flag:#C0432A; --ok:#2E7D4F;
    --series-1:#7A47CC; --series-2:#C94F1D; --series-mute:#CFC9DE;
    --chip-bg:#F4F2FA;
    /* Lever fills. Hue encodes the lever, lightness encodes the evidence: the two
       traffic fills are one hue in two steps because measured and anonymized are
       the SAME lever split by what we can see, not two different things.
       Validated with the dataviz validator, --pairs all: light passes all six
       checks (worst CVD ΔE 11.2 deutan, worst normal ΔE 15.7). A four-HUE set is
       not available here — purple and blue collapse under deuteranopia (ΔE 1–4),
       which is why the traffic split is a ramp rather than a fourth hue. */
    --lv-measured:#7A47CC; --lv-anon:#A87FE0;
    --lv-index:#C94F1D;    --lv-bing:#00997C;
    /* Ink for a label sitting ON each fill. Measured per fill rather than set to
       white everywhere: white on the light steps is 2.0–3.1:1 and fails. Every
       pair below clears 4.5:1, and which one wins differs by fill AND by theme. */
    --on-measured:#FFFFFF; --on-anon:#0B0911;
    --on-index:#FFFFFF;    --on-bing:#0B0911;
  }

      --brass:#A973FF; --brass-line:#7A47CC;
      --flag:#FF7333; --ok:#99EB47;
      --series-1:#915CE6; --series-2:#E8622A; --series-mute:#423766;
      --chip-bg:#2C2544;
      /* Dark is SELECTED, not flipped. Own steps, re-validated against #1A1428:
         all pass except the lightness band on --lv-anon (L .783 vs a .67 ceiling).
         That ceiling is the categorical check; these two purples are a 2-step ramp,
         where monotonic lightness plus contrast is what governs — and holding the
         band would drop the pair to ΔE 13.7, under the 15 floor. Separation wins. */
      --lv-measured:#915CE6; --lv-anon:#C3A9F2;
      --lv-index:#E8622A;    --lv-bing:#28AD86;
      /* All four dark fills are bright enough that dark ink wins on every one. */
      --on-measured:#0B0911; --on-anon:#0B0911;
      --on-index:#0B0911;    --on-bing:#0B0911;
  }
  }
  :root[data-theme="dark"] {
    --bg:#0B0911; --surface:#1A1428; --surface-sunk:#120E1D;
    --ink:#EFE6FF; --ink-2:#C0B6D6; --ink-3:#8B829E;
    --rule:#2C2544; --rule-soft:#221C36;
    --brass:#A973FF; --brass-line:#7A47CC;
    --flag:#FF7333; --ok:#99EB47;
    --series-1:#915CE6; --series-2:#E8622A; --series-mute:#423766;
    --chip-bg:#2C2544;
    --lv-measured:#915CE6; --lv-anon:#C3A9F2;
    --lv-index:#E8622A;    --lv-bing:#28AD86;
    --on-measured:#0B0911; --on-anon:#0B0911;
    --on-index:#0B0911;    --on-bing:#0B0911;
  }
  *,*::before,*::after { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Host Grotesk",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    font-size:17px; font-weight:400; line-height:1.62; -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  .wrap { max-width:1160px; margin:0 auto; padding:0 32px; }

  /* ── internal-use bar ────────────────────────────────────────────────── */
  /* This artifact combines data from MORE THAN ONE Botify account, so it is not
     distributable while that is true. The bar is not dismissible: a disclaimer
     with a close button is a disclaimer that is not there.

     Fixed colours, and it REDECLARES its own tokens rather than inheriting —
     DESIGN.md §2. Same failure mode as a dark band: half-inherited tokens render
     a light rule on a dark ground and the bug is invisible in whichever theme it
     was built in. Ground is #CC2222 and every mark on it is plain #FFFFFF at 5.5:1 —
     one ink, differentiated by WEIGHT rather than by tint, because the softer off-whites
     that would carry a hierarchy here land at 3.9-4.7:1 and only the top of that range
     passes. Weight is free; a second tint costs contrast.
     Named accounts stay OUT of this string — which accounts is a repo fact, per
     CLAUDE.md. The bar says "multiple", the STATE file says which. */
  .disclaim {
    --ink:#FFFFFF; --ink-2:#FFFFFF; --ink-3:#FFFFFF; --rule:#A31A1A;
    background:#CC2222; color:#FFFFFF;
    border-bottom:1px solid #A31A1A;
  }
  .disclaim .inner {
    max-width:1160px; margin:0 auto; padding:11px 32px;
    display:flex; gap:6px 14px; align-items:baseline; flex-wrap:wrap;
    font-size:13.5px; line-height:1.45;
  }
  .disclaim .tag {
    font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    font-size:11.5px; white-space:nowrap;
  }
  .disclaim .msg { margin:0; font-weight:400; }
  .disclaim .msg em { font-style:normal; font-weight:700; }

  /* ── masthead (band) ─────────────────────────────────────────────────── */
  .band {
    --bg:#0B0911; --surface:#1A1428; --surface-sunk:#120E1D;
    --ink:#EFE6FF; --ink-2:#C0B6D6; --ink-3:#8B829E;
    --rule:#2C2544; --rule-soft:#221C36; --brass:#A973FF; --brass-line:#7A47CC;
    --flag:#FF7333; --ok:#99EB47; --chip-bg:#2C2544;
    --series-1:#915CE6; --series-2:#E8622A; --series-mute:#423766;
    --lv-measured:#915CE6; --lv-anon:#C3A9F2;
    --lv-index:#E8622A;    --lv-bing:#28AD86;
    --on-measured:#0B0911; --on-anon:#0B0911;
    --on-index:#0B0911;    --on-bing:#0B0911;
    background:#0B0911; color:#EFE6FF; position:relative; overflow:hidden;
  }
  .band::before {
    content:""; position:absolute; inset:-40% -10% auto -10%; height:170%;
    background:linear-gradient(135deg,#34294f 49%,#563c81 67%,#ab6bfc 78%,#d1a9ff 88%,#ddbeff);
    opacity:.16; filter:blur(70px); pointer-events:none;
  }
  .band > * { position:relative; }
  .mast { padding:34px 0 26px; }
  .kicker { font-size:12px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
            color:#A973FF; margin:0 0 12px; }
  h1 { font-size:clamp(1.9rem,4.4vw,3.1rem); font-weight:700; line-height:1;
       letter-spacing:-.036em; margin:0; }

  /* ── masthead utility links ──────────────────────────────────────────── */
  /* Reference surfaces that are not stages. They sit opposite the kicker rather
     than in the tab bar, because the tab bar is the MEASUREMENT CHAIN and putting
     a reference page in it implies it is a step. Sources moved here for exactly
     that reason: it is the provenance ledger, not a stage.
     Inside the .band, so these are fixed dark-ground colours like the rest of it. */
  .mast-row { display:flex; gap:18px 32px; align-items:flex-end;
              justify-content:space-between; flex-wrap:wrap; }
  .util { display:flex; gap:8px; flex-wrap:wrap; padding-bottom:4px; }
  .util button {
    display:flex; align-items:center; gap:7px;
    padding:7px 13px; border:1px solid #2C2544; border-radius:99px;
    background:transparent; color:#C0B6D6;
    font:inherit; font-size:12px; font-weight:700; letter-spacing:.03em;
    cursor:pointer; transition:color .15s ease, border-color .15s ease;
  }
  .util button:hover { color:#EFE6FF; border-color:#7A47CC; }
  .util button[aria-current="page"] { color:#A973FF; border-color:#7A47CC;
                                      background:rgba(169,115,255,.12); }
  .util svg { width:15px; height:15px; flex:none; }

  /* ── controls in masthead ────────────────────────────────────────────── */
  .ctl-row { display:flex; gap:10px 26px; flex-wrap:wrap; align-items:flex-end; }
  .ctl { display:grid; gap:7px; }
  .ctl > .lbl { font-size:11px; font-weight:700; letter-spacing:.11em;
                text-transform:uppercase; color:#8B829E; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg button {
    padding:7px 14px; border:1px solid var(--rule); border-radius:99px;
    background:transparent; color:var(--ink-3);
    font:inherit; font-size:12px; font-weight:700; cursor:pointer;
    letter-spacing:.04em; transition:color .15s ease, border-color .15s ease;
  }
  .seg button:hover { color:var(--ink); }
  .seg button[aria-pressed="true"] {
    border-color:var(--brass); background:rgba(169,115,255,.12); color:var(--brass);
  }

  /* Term-and-definition pairs. A grid rather than inline flow, because a chip followed
     by wrapping prose puts the second line under the CHIP instead of under the text,
     and the key stops reading as a key. Collapses to one column when narrow. */
  .deflist {
    display:grid; grid-template-columns:max-content 1fr; gap:10px 16px;
    align-items:baseline; margin-top:18px;
  }
  @media (max-width:640px) { .deflist { grid-template-columns:1fr; gap:4px 0; } }

  /* An inline text action inside body copy — for pointing at another surface without
     dressing it up as a button. Reads as a link, behaves as the tab control it is. */
  .lnk {
    border:0; background:none; padding:0; font:inherit; font-size:14px; font-weight:700;
    color:var(--brass); cursor:pointer; text-underline-offset:3px;
    text-decoration:underline; text-decoration-thickness:1px;
  }
  .lnk:hover { color:var(--ink); }

  /* ── stage tabs (Framework tab) ──────────────────────────────────────── */
  /* Deliberately the SAME idiom as the masthead tab bar — coloured rail, uppercase
     label, a meta line underneath — rather than a pill row, which read as filter
     chips and matched nothing else in the document. The selected tab sits flush on
     the panel with no bottom border, so the strip and the panel are visibly one
     object. That join is what makes them read as tabs rather than buttons. */
  .stagetabs {
    display:flex; gap:4px; flex-wrap:wrap; align-items:stretch;
    margin:0; padding:0; border-bottom:1px solid var(--rule);
  }
  .stagetab {
    position:relative; flex:1 1 140px; min-width:132px;
    padding:13px 16px 12px; cursor:pointer; font:inherit; text-align:left;
    background:var(--surface-sunk); color:var(--ink-3);
    border:1px solid var(--rule); border-bottom:none;
    border-radius:9px 9px 0 0; margin-bottom:-1px;
    transition:background .15s ease, color .15s ease;
  }
  .stagetab::before {                 /* the rail, as on every other tab in this file */
    content:""; position:absolute; left:-1px; right:-1px; top:-1px; height:3px;
    background:var(--rail); opacity:.3; border-radius:9px 9px 0 0;
    transition:opacity .15s ease;
  }
  .stagetab:hover { color:var(--ink-2); }
  .stagetab[aria-selected="true"] {
    background:var(--surface); color:var(--ink);
    border-bottom:1px solid var(--surface);
  }
  .stagetab[aria-selected="true"]::before { opacity:1; }
  .stagetab .st-l { display:block; font-size:13.5px; font-weight:800;
                    letter-spacing:.055em; text-transform:uppercase; }
  .stagetab .st-m { display:block; margin-top:4px; font-size:10px; font-weight:700;
                    letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); }
  .stagetab[aria-selected="true"] .st-m { color:var(--rail); }
  @media (max-width:640px) { .stagetab { flex:1 1 100%; } }

  .stagepanel { border:1px solid var(--rule); border-top:none; border-radius:0 0 14px 14px;
                padding:26px 24px 24px; background:var(--surface); }
  .sp-head { display:flex; gap:16px 24px; justify-content:space-between;
             align-items:flex-start; flex-wrap:wrap; margin-bottom:22px; }
  .sp-head h4 { margin:0; font-size:20px; letter-spacing:-.02em; }
  .sp-q { margin:5px 0 0; color:var(--ink-2); font-size:15px; }
  .sp-grid { display:grid; gap:20px 28px; grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
             padding-bottom:22px; border-bottom:1px solid var(--rule-soft); }
  .sp-k { font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
          color:var(--ink-3); margin-bottom:7px; }
  .sp-v { margin:0; font-size:14.5px; line-height:1.55; }
  .sp-metrics { padding-top:22px; }

  /* Chart key. Marks are drawn, not described — a diamond in prose is not a key. */
  .ckey { display:flex; gap:10px 22px; flex-wrap:wrap; align-items:center;
          margin:14px 0 0; font-size:12.5px; color:var(--ink-2); }
  .ckey span { display:flex; align-items:center; gap:7px; }
  .ckey svg { width:26px; height:14px; flex:none; overflow:visible; }

  /* ── tab bar ─────────────────────────────────────────────────────────── */
  /* Section nav as cards with a coloured top rail — the same rail device used on
     KPI cards elsewhere in the system. The rail colour encodes what kind of
     surface it is (model / leading / midterm / lagging / reference), so the
     colour carries meaning rather than decorating. */
  .tabbar { position:sticky; top:0; z-index:20; background:rgba(11,9,17,.93);
            backdrop-filter:blur(16px); border-bottom:1px solid #221C36; }
  .tabbar .inner {
    max-width:1160px; margin:0 auto; padding:20px 32px;
    display:flex; flex-wrap:wrap; gap:5px; align-items:stretch;
  }

  .tab {
    position:relative; overflow:hidden;
    flex:1 1 140px; min-width:140px;
    display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end;
    gap:4px; min-height:78px; padding:12px 13px 12px; text-align:left;
    font:inherit; cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.058),rgba(255,255,255,.012));
    border:1px solid rgba(255,255,255,.085);
    border-radius:13px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    transition:background .16s ease, border-color .16s ease, transform .16s ease;
  }
  .tab::before {
    content:""; position:absolute; inset:0 0 auto 0; height:2px;
    background:linear-gradient(90deg,transparent,var(--rail) 16%,var(--rail) 84%,transparent);
    opacity:.55; transition:opacity .16s ease, height .16s ease;
  }
  .tab:hover:not(:disabled):not([aria-selected="true"]) {
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    border-color:rgba(255,255,255,.17); transform:translateY(-1px);
  }
  .tab:hover:not(:disabled)::before { opacity:.8; }
  .tab[aria-selected="true"] {
    background:linear-gradient(180deg,#2E2448,#1D1730);
    border-color:#4E4270;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 6px 18px -10px rgba(0,0,0,.7);
  }
  .tab[aria-selected="true"]::before { opacity:1; height:3px; }
  .tab:disabled { cursor:not-allowed; background:rgba(255,255,255,.012);
                  border-color:rgba(255,255,255,.045); box-shadow:none; }
  .tab:disabled::before { opacity:.22; }
  .tab:focus-visible { outline:2px solid #A973FF; outline-offset:3px; }

  /* Oversized ghost glyph, right-aligned and bleeding off the edge. Drawn with a
     non-scaling hairline stroke so scale never thickens the line. */
  .tab .tg {
    position:absolute; right:13px; top:50%; transform:translateY(-50%);
    height:74%; width:auto; aspect-ratio:1/1;
    color:var(--rail); opacity:.07; pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  .tab[aria-selected="true"] .tg { opacity:.18; }
  .tab:hover:not(:disabled) .tg { opacity:.13; transform:translateY(-50%) scale(1.05); }
  .tab:disabled .tg { opacity:.035; }
  .tab .tl { position:relative; z-index:1;
             font-size:16px; font-weight:800; letter-spacing:.07em;
             text-transform:uppercase; white-space:nowrap; color:#D3CBE4;
             transition:color .16s ease; }
  .tab[aria-selected="true"] .tl { color:#FFFFFF; }
  .tab:hover:not(:disabled) .tl { color:#FFFFFF; }
  .tab:disabled .tl { color:#4A4260; }
  .tab .tm { position:relative; z-index:1; display:flex; align-items:center; gap:6px;
             font-size:10.5px; font-weight:700; letter-spacing:.2em;
             text-transform:uppercase; color:#6F6489; }
  .tab[aria-selected="true"] .tm { color:#9A8FB5; }
  .tab .lk { width:11px; height:11px; flex:none; }
  /* Work-in-progress marker. Amber rather than the neutral meta ink, so "still being
     built" reads as a status and not as another tier label. Flip one flag on the stage
     to remove it — see `wip` in STAGES. */
  .tab .wm { width:12px; height:12px; flex:none; }
  .tab[data-wip] .tm { color:#FFA766; }
  .tab[aria-selected="true"][data-wip] .tm { color:#FFB07A; }

  /* ── shell-only control strip, parked at the foot so it can't compete with
     the tabs. Scope will move next to the figures it reframes once there are
     figures; the preview switch comes out when real metrics wire in. ── */
  .devbar { margin-top:80px; padding-top:24px; border-top:1px solid var(--rule); }
  .devbar .ctl-row { gap:14px 34px; }
  .devbar .lbl { color:var(--ink-3); }
  .devbar .hint { font-size:13px; color:var(--ink-3); margin:16px 0 0; max-width:70ch; }

  /* ── page body ───────────────────────────────────────────────────────── */
  main.wrap { padding:22px 32px 110px; }
  .shead { margin-bottom:28px; }
  .shead h2 { font-size:clamp(1.8rem,3.6vw,2.6rem); font-weight:700; line-height:1.04;
              letter-spacing:-.032em; margin:0; }
  .hrow { display:flex; gap:8px; flex-wrap:wrap; }
  .shead .hrow { margin-top:14px; }
  .shead .sub { font-size:17px; color:var(--ink-2); margin:14px 0 0; max-width:64ch; }

  .cols { display:grid; grid-template-columns:300px minmax(0,1fr); gap:0; align-items:start; }
  .cols > :first-child { padding-right:36px; border-right:1px solid var(--rule-soft); }
  .cols > :last-child { padding-left:38px; }
  /* ── inputs flyout ────────────────────────────────────────────────────────
     The inputs live in an off-canvas drawer rather than a column, so the charts get
     the full 1096px unconditionally instead of 758px. Two ways in: the pill in the
     bar, and a fixed edge tab that stays reachable when you are 3000px down looking
     at a chart and want to move a slider. */
  .scrim { position:fixed; inset:0; z-index:40; background:rgba(11,9,17,.55);
           backdrop-filter:blur(2px); border:0; padding:0; cursor:pointer; }
  .drawer {
    position:fixed; top:0; left:0; bottom:0; z-index:41;
    width:min(392px, 90vw); overflow-y:auto; overscroll-behavior:contain;
    padding:24px 26px 48px; background:var(--surface);
    border-right:1px solid var(--rule);
    box-shadow:0 0 0 1px rgba(11,9,17,.04), 24px 0 60px -30px rgba(11,9,17,.45);
  }
  .drawer.in { animation:drawerIn .22s ease both; }
  @keyframes drawerIn { from { transform:translateX(-101%); } to { transform:none; } }
  .drawer .dhead { display:flex; align-items:center; justify-content:space-between;
                   gap:12px; margin-bottom:18px; }
  .drawer .dhead .t { font-size:12px; font-weight:700; letter-spacing:.2em;
                      text-transform:uppercase; color:var(--brass); }
  button.dclose { display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; flex:none; border:1px solid var(--rule); border-radius:99px;
    background:var(--surface-sunk); color:var(--ink-2); cursor:pointer; font:inherit; }
  button.dclose:hover { color:var(--ink); border-color:var(--brass); }
  button.dclose svg { width:12px; height:12px; }
  /* Reachable from any scroll position. Hidden on narrow viewports, where it would
     sit on top of the content it is meant to sit beside. */
  button.edge-tab {
    position:fixed; left:0; top:50%; transform:translateY(-50%); z-index:30;
    writing-mode:vertical-rl; text-orientation:mixed;
    padding:16px 9px; border:1px solid var(--rule); border-left:0;
    border-radius:0 12px 12px 0; background:var(--surface-sunk); color:var(--ink-2);
    font:inherit; font-size:11px; font-weight:700; letter-spacing:.16em;
    text-transform:uppercase; cursor:pointer;
    box-shadow:6px 0 20px -14px rgba(11,9,17,.5);
    transition:color .15s ease, border-color .15s ease, padding .15s ease;
  }
  button.edge-tab:hover { color:var(--brass); border-color:var(--brass); padding-right:13px; }
  @media (max-width:940px) { button.edge-tab { display:none; } }

  /* The inputs bar sits above the figures and carries the live-settings read-out. */
  .inbar { display:flex; align-items:center; gap:14px 18px; flex-wrap:wrap;
           margin:0 0 22px; padding-bottom:16px; border-bottom:1px solid var(--rule-soft); }
  .inbar .sum { display:flex; gap:6px 8px; flex-wrap:wrap; }
  button.collapse {
    display:inline-flex; align-items:center; gap:9px; flex:none;
    padding:8px 15px; border:1px solid var(--rule); border-radius:99px;
    background:var(--surface-sunk); color:var(--ink-2);
    font:inherit; font-size:12px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
  }
  button.collapse:hover { color:var(--ink); border-color:var(--brass); }
  button.collapse svg { width:11px; height:11px; flex:none;
                        transition:transform .18s ease; }
  button.collapse[aria-expanded="false"] svg { transform:rotate(-90deg); }
  .stack { display:grid; gap:0; }
  @media (max-width:940px) {
    .cols { grid-template-columns:1fr; }
    .cols > :first-child { padding-right:0; border-right:0; padding-bottom:32px;
                           margin-bottom:32px; border-bottom:1px solid var(--rule-soft); }
    .cols > :last-child { padding-left:0; }
  }

  .fig { background:none; border:0; border-radius:0; padding:0; box-shadow:none; }
  .fig + .fig { margin-top:38px; padding-top:32px; border-top:1px solid var(--rule-soft); }
  .fig > h3 { font-size:18px; font-weight:700; margin:0 0 7px; letter-spacing:-.014em; }
  /* No measure cap on either of these. 80ch/74ch is the readable line length, but the
     container is 1160px wide and these blocks sit directly under full-width charts and
     tables, so the short column read as a layout bug rather than as typography. Full
     width by explicit request 2026-08-11 — restore max-width:80ch / 74ch to undo. */
  .fig > .note { font-size:14px; line-height:1.55; color:var(--ink-3); margin:0 0 20px; }
  .fig > .note:last-child { margin-bottom:0; }

  /* ── the slot: a visual position we have NOT filled yet ──────────────── */
  .slot { border:0; border-radius:10px; padding:24px 20px;
          background:var(--surface-sunk); display:grid; gap:8px; align-content:center;
          text-align:center; }
  .slot .sl-k { font-size:11px; font-weight:700; letter-spacing:.12em;
                text-transform:uppercase; color:var(--brass); }
  .slot .sl-t { font-size:15px; font-weight:700; color:var(--ink-2); }
  .slot .sl-n { font-size:13px; color:var(--ink-3); max-width:52ch; margin:0 auto; line-height:1.5; }
  .slot.tall { min-height:300px; }
  .slot.mid  { min-height:190px; }
  .slot.low  { min-height:120px; }

  /* ── charts ──────────────────────────────────────────────────────────── */
  /* Measured-pixel sizing: the viewBox is 1:1 with CSS pixels so axis labels stay
     at their intended size instead of being magnified by a scaled fixed viewBox.
     mountCharts() reads clientWidth and rebuilds. */
  .chart { width:100%; }
  .chart > svg { display:block; width:100%; height:100%; overflow:visible; }
  .legend { display:flex; gap:8px 18px; flex-wrap:wrap; margin:0 0 14px; }
  .legend span { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-2); }
  .swatch { width:11px; height:11px; border-radius:3px; flex:none; }

  /* ── stat row ────────────────────────────────────────────────────────── */
  /* 248px min lands the four headline figures as 2x2 in the content column rather
     than 3 + 1 orphan, and leaves a range like "$2.48M – $20.50M" room on one line. */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(248px,1fr)); gap:14px; }
  .stat { position:relative; overflow:hidden; padding:18px 18px 16px;
          background:var(--surface-sunk); border-radius:13px; }

/* ══ MODEL:BEGIN ═══════════════════════════════════════════════════════════════

   THE FORECAST ARITHMETIC IS DUPLICATED. This is a port of forecast.py, which
   remains the reference implementation. Change the maths in one, change it in the
   other, then run `python3 verify_parity.py` — it extracts this block, runs it in
   node against forecast.py, and fails if any figure diverges.

   The duplication is not laziness: an artifact runs under a CSP that blocks every
   external host, so the sliders cannot call the Python. What is NOT duplicated is
   the inputs — those are injected above from the same source.

   Everything here is pure. No DOM, no reads of S: functions take an explicit cfg
   so verify_parity.py can drive them directly.
   ────────────────────────────────────────────────────────────────────────────── */

const DAY = 864e5;
// Three tiers. `mid` is DERIVED — the midpoint of every input in the bundle, including
// the ramp, because the tiers are paired 1:1 and a mid target on an aggressive ramp is
// exactly the 2x2 the model forbids. It is an interpolation, not a scenario Walmart or
// the workbook supplied, and it is labelled that way wherever it appears.
const TIERS = ['low', 'mid', 'high'];

// Python's round() is banker's rounding (half-to-even); JS Math.round is half-up.
// The tranche offsets are the one place a .5 arises (rampWeeks*7/tranches — e.g.
// 3 weeks over 2 tranches gives 10.5, which Python floors to 10 and JS would lift
// to 11), so match Python here or the two models drift apart on that setting.
function pyRound(x) {
  const f = Math.floor(x);
  if (Math.abs(x - f - 0.5) > 1e-9) return Math.round(x);
  return f % 2 === 0 ? f : f + 1;
}

// Whole-day arithmetic in UTC. A local-midnight Date would gain or lose an hour
// across the November DST shift, which lands inside every pilot window we model.
const dayNum = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / DAY;
const monthOf = n => new Date(n * DAY).getUTCMonth() + 1;

// How much of the base is measured vs anonymized-attributed. A ratio taken from
// the live bases, never a level: RealKeywords is sampled.
function bucketWeights(cfg) {
  const anon = DATA.weights.anon * cfg.anon;
  const total = DATA.weights.measured + anon;
  return total ? [DATA.weights.measured / total, anon / total] : [1, 0];
}

// Google's shape, bucket-weighted. Keywords stay PURE non-branded: the anonymized
// bucket has keywords = 0 in every one of 22 months, so it can never reach a
// keyword target and the inclusion slider must leave keyword figures untouched.
function seasonality(cfg) {
  const [wNb, wAn] = bucketWeights(cfg);
  const out = {impressions: {}, clicks: {}, keywords: {}};
  for (const metric of ['impressions', 'clicks']) {
    for (let m = 1; m <= 12; m++) {
      out[metric][m] = wNb * DATA.seas.nonbrand[metric][m] + wAn * DATA.seas.anon[metric][m];
    }
  }
  for (let m = 1; m <= 12; m++) out.keywords[m] = DATA.seas.nonbrand.keywords[m];
  return out;
}

function annualTargets(cfg) {
  const L = DATA.levels;
  const baseImpr = L.measuredNonbrandImpr + L.anonAssignedImpr * cfg.anon;
  const out = {impressions: {}, clicks: {}, levers: {}, keywords: {}};
  TIERS.forEach(t => out.keywords[t] = L.keywords[t]);
  for (const t of TIERS) {
    const trafficImpr = baseImpr * cfg.growth[t];
    const trafficClks = trafficImpr * L.nonbrandCtr;
    const pages = L.poolCrawledNotIndexed * cfg.dial[t];
    const idxClks = pages * cfg.clicksPerPage * cfg.newPagePerf;
    const idxImpr = pages * L.imprPerIndexedPage * cfg.newPagePerf;
    // The traffic lever split by where its base came from. This is the
    // defensibility line: how much of the number is measured vs attributed.
    const measuredShare = baseImpr ? L.measuredNonbrandImpr / baseImpr : 1;
    out.levers[t] = {
      traffic_measured:   trafficClks * measuredShare,
      traffic_anonymized: trafficClks * (1 - measuredShare),
      indexation:         idxClks,
      bing:               cfg.bing ? L.bingClicks[t] : 0,
    };
    out.clicks[t] = Object.keys(out.levers[t]).reduce((a, k) => a + out.levers[t][k], 0);
    out.impressions[t] = trafficImpr + idxImpr + (cfg.bing ? L.bingImpr[t] : 0);
  }
  return out;
}

// Pages go live in equal groups; each runs its own adoption curve from its own
// go-live, so a tranche contributes nothing before it exists.
function trancheList(cfg) {
  if (cfg.rampWeeks <= 0) return [[0, 1]];
  const step = cfg.rampWeeks * 7 / cfg.tranches;
  const out = [];
  for (let i = 0; i < cfg.tranches; i++) out.push([pyRound(i * step), 1 / cfg.tranches]);
  return out;
}

const PAIR = {low: 'conservative', mid: 'moderate', high: 'aggressive'};  // 1:1, never a 2x2
// `curve` overrides which ramp the tier gets. Its only use is to isolate how much of
// the low/high spread is the ramp assumption, by running one scenario against the
// other's curve. The scenarios are otherwise paired 1:1 and never crossed — see the
// note in the Projection figure.
function rampFraction(tier, day, curve) {
  if (day < 0) return 0;
  return DATA.ramp[curve || PAIR[tier]][Math.min(Math.floor(day / 30), 3)];
}
// Blended coverage across every tranche, `day` days after launch. Same sum
// forecast.py inlines in weekly_series; named here because the exit run-rate is
// this value read at the decision date.
function rampAt(cfg, tier, day, curve) {
  const tr = trancheList(cfg);
  let r = 0;
  for (let i = 0; i < tr.length; i++) {
    r += tr[i][1] * rampFraction(tier, day - tr[i][0], curve);
  }
  return r;
}

// Google and Bing are integrated SEPARATELY and summed, so neither borrows the
// other's seasonal shape. Bing is nearly flat on impressions (Nov 1.031) — its
// holiday effect is CTR, not volume — so lending it Google's non-branded Nov 1.31
// gave it a lift it has not earned. Keywords are Google-only: no Bing keyword
// target exists.
//
// `stride` is the emit interval in days; 7 (the default) gives the week-ends this is
// named for, 1 gives every day. Charts want 1: the ramp steps are slope
// discontinuities, so the cumulative curve has real corners at them, and a weekly
// sample smears each corner across up to a week.
//
// `engine` selects which parts to accumulate — 'both', 'google' or 'bing'. The
// split is not a new model: it is these same two integrations returned separately
// instead of added, so google + bing === both at every point. Google's part carries
// the traffic AND indexation levers; Bing's indexation lever is deliberately out of
// the model, so Bing is traffic only.
function weeklySeries(cfg, metric, tier, engine, curve, stride, endISO) {
  const ann = annualTargets(cfg), seas = seasonality(cfg), bseas = DATA.seas.bing;
  let bingPart = 0;
  if (cfg.bing && bseas[metric]) {
    bingPart = metric === 'impressions' ? DATA.levels.bingImpr[tier]
                                        : DATA.levels.bingClicks[tier];
  }
  let googBase = (ann[metric][tier] - bingPart) / 365;
  let bingBase = bingPart / 365;
  if (engine === 'google') bingBase = 0;
  else if (engine === 'bing') googBase = 0;
  const L = dayNum(cfg.launch), D = dayNum(endISO || cfg.decision);
  const pts = [];
  let run = 0;
  for (let d = L; d <= D; d++) {
    const ramp = rampAt(cfg, tier, d - L, curve);
    const m = monthOf(d);
    const g = seas[metric][m];
    if (g) run += googBase * g * ramp;
    if (bingBase) {
      const b = bseas[metric][m];
      if (b) run += bingBase * b * ramp;
    }
    const st = stride || 7;
    if ((d - L) % st === st - 1 || d === D) pts.push({day: d - L, month: m, v: run});
  }
  return pts;
}

function cumulative(cfg, metric, tier, engine, curve) {
  const pts = weeklySeries(cfg, metric, tier, engine, curve);
  return pts.length ? pts[pts.length - 1].v : 0;
}

// ═══ the client's own trajectory — where they land WITHOUT us ═══════════════
// The forecast answers "what does Botify add". It cannot answer "what happens
// anyway", and without that the incremental has no denominator.
//
// Scope is property TOTAL for the search engines: Bing has no brand split in the
// day-grain store, so total is the only scope where Bing has data and where a
// combined figure is legitimate. The Botify lift is non-branded only, which is
// ~6% of that base — so the deviation is a non-branded gain against a total base.
// True, but it has to be said out loud, which is what `nonbrandShareOfCombined` is
// for.
const TRAJ = () => DATA.trajectory;

// The measured monthly actuals, before any trend — what they are running at today.
// The trend effect is baseline minus this, so it has to be window-scoped: over a
// Sep-Dec window the annual total is the wrong denominator.
function heldMonthly(engine, trends) {
  const out = {};
  if (engine === 'combined') {
    const g = heldMonthly('google', trends), b = heldMonthly('bing', trends);
    for (let m = 1; m <= 12; m++) out[m] = (g[m] || 0) + (b[m] || 0);
    return out;
  }
  if (engine === 'ai') {
    const ann = aiBaseline(trends.aiBasis).allAiAnnualVisits;
    for (let m = 1; m <= 12; m++) out[m] = ann / 12;
    return out;
  }
  const mo = TRAJ().engines[engine].monthly;
  for (const k in mo) out[+k] = mo[k];
  return out;
}

function baselineMonthly(engine, trends) {
  // Combined first: each engine carries its OWN measured trend, so there is no
  // single combined trend. Averaging them would weight a 7% channel like a 93% one.
  if (engine === 'combined') {
    const g = baselineMonthly('google', trends), b = baselineMonthly('bing', trends);
    const out = {};
    for (let m = 1; m <= 12; m++) out[m] = (g[m] || 0) + (b[m] || 0);
    return out;
  }
  const t = trends[engine], held = heldMonthly(engine, trends), out = {};
  for (const k in held) out[+k] = held[k] * (1 + t);
  return out;
}

// n is carried through deliberately: two volatile weeks is not a baseline, and
// anything reading this figure needs to see how thin it is.
// basis: <three_day|same_session>_<mean|w16|latest>. 3D is the default — it is Walmart's own
// AEO channel basis, verified against the scorecard's reported AOV ($101) and CR (8.3%).
function aiBaseline(basis) {
  const A = TRAJ().ai, obs = A.weeks;
  const b = basis || 'three_day_mean';
  const cut = b.lastIndexOf('_');
  const kind = cut > 0 ? b.slice(0, cut) : 'three_day';
  const which = cut > 0 ? b.slice(cut + 1) : 'mean';
  const rows = which === 'w16' ? [obs[0]]
             : which === 'latest' ? [obs[obs.length-1]]
             : obs;
  const v = rows.reduce((a, w) => a + w[kind].visits, 0) / rows.length;
  const g = rows.reduce((a, w) => a + w[kind].gmv, 0) / rows.length;
  const n = rows.length;
  const attested = rows.every(w => w[kind].attested !== false);
  const openaiAnnual = v * 52;
  const allAi = openaiAnnual * A.ecosystem;
  return {basis: b, kind, n, attested, weeklyVisits: v, weeklyGmv: g,
          rpv: v ? g / v : 0,
          openaiAnnualVisits: openaiAnnual,
          allAiAnnualVisits: allAi,
          // ONCE. The workbook's "Annual All-AI Visits" row already contains this
          // factor while being labelled ecosystem-scaling only, then haircuts it
          // again — so its lift base is 0.64x rather than 0.80x.
          riskAdjustedVisits: allAi * A.risk};
}

// NO seasonality: there is no AI seasonal history to measure, and borrowing the
// retail curve would be an assumption dressed as data. The ramp does apply —
// SpeedWorkers serves rendered pages to AI crawlers on the same schedule.
function aiSeries(cfg, tier, basis, endISO, stride) {
  const base = aiBaseline(basis).riskAdjustedVisits * TRAJ().ai.lift[tier] / 365;
  const L = dayNum(cfg.launch), D = dayNum(endISO || cfg.decision);
  const st = stride || 7;
  const pts = [];
  let run = 0;
  for (let d = L; d <= D; d++) {
    run += base * rampAt(cfg, tier, d - L);
    if ((d - L) % st === st - 1 || d === D) pts.push({day: d - L, month: monthOf(d), v: run});
  }
  return pts;
}

// Ends at the DECISION date, not a fixed year: the whole tab reports to one horizon,
// so a trajectory running eight months past the decision would put the headline
// revenue figure and this chart on different clocks.
// How much more a Walmart AI visit is worth than an SEO visit. From the SHARE
// figures, not the absolute ones: each scorecard states AI as a % of SEO visits AND
// as a % of SEO GMV in the same sentence, so the ratio is basis-independent even
// where the absolutes are contested. W16 gives 11.2/5.3 = 2.11x, W17 11.0/4.6 = 2.39x.
function aiPremium() {
  const rs = TRAJ().ai.weeks
    .filter(w => w.visit_share_of_seo && w.gmv_share_of_seo)
    .map(w => w.gmv_share_of_seo / w.visit_share_of_seo);
  return rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null;
}

// Search revenue and AI revenue, kept APART. They are measured by different systems
// — our GSC/BWT click archive against Walmart's AEO visit channel, whose SEO visit
// count runs ~2x our click count. They are summed only because Walmart itself reports
// AEO and SEO as sibling channels, and the sum is labelled as spanning two bases
// wherever it appears.
function revenueSplit(cfg, tier, basis, endISO) {
  const pts = weeklySeries(cfg, 'clicks', tier, 'both', null, 7, endISO);
  const search = (pts.length ? pts[pts.length-1].v : 0) * cfg.rpv;
  const ap = aiSeries(cfg, tier, basis, endISO, 7);
  const visits = ap.length ? ap[ap.length-1].v : 0;
  const aiRev = visits * aiBaseline(basis).rpv;
  return {search, ai: aiRev, aiVisits: visits,
          total: search + (cfg.includeAi ? aiRev : 0)};
}

// Cumulative revenue in DOLLARS over time, by component.
//
// Dollars are the one unit search and AI genuinely share. Clicks and visits are not
// comparable — Walmart's visit count runs ~2x our click count — but the money is,
// which is why every revenue surface routes through here rather than each chart
// multiplying its own clicks by its own RPV and quietly omitting AI.
//
// component: total | search | google | bing | ai
// Annual incremental AI visits and revenue at FULL coverage — the same basis the search
// levers are quoted on, so the two can sit in one table.
function aiAnnual(cfg, tier, basis) {
  const b = aiBaseline(basis);
  const visits = b.riskAdjustedVisits * TRAJ().ai.lift[tier];
  return {visits, revenue: visits * b.rpv, rpv: b.rpv};
}

// Every component of the annual target on ONE unit — revenue. Clicks and visits do not
// sum; revenue does, which is the only way a single table accounts for all of it.
// Native volume rides along so nothing is silently converted.
const COMPOSITION = [
  ['traffic_measured', 'Traffic — measured non-branded', '--lv-measured', 'Observed', 'info',
   'Non-branded impressions where we can see the actual query.'],
  ['traffic_anonymized', 'Traffic — anonymized-attributed', '--lv-anon', 'Inferred', 'wait',
   'Queries Google withholds (keyword = n/a, 89.75% of US impressions), apportioned by the non-brand share of named traffic.'],
  ['indexation', 'Indexation', '--lv-index', 'Modelled', 'wait',
   'A share of the 434M pages Google has crawled and chosen not to index getting indexed, and performing below average.'],
  ['bing', 'Bing Growth', '--lv-bing', 'Inferred', 'wait',
   'Non-branded derived as property total minus branded head, not summed from a capped query export.'],
  ['ai', 'AI Growth', '--lv-bing', 'Only 2 weeks', 'block',
   'Two weekly scorecards, in Walmart AEO visits rather than clicks. Hatched, not a fifth colour: this palette supports three hues plus ramps, and pairing AI with indexation by hue would imply a relationship that is not there.'],
];

function annualComposition(cfg, tier, basis) {
  const ann = annualTargets(cfg);
  const out = [];
  COMPOSITION.forEach(([key, label, tok, grade, gcls, note]) => {
    if (key === 'ai') {
      if (!cfg.includeAi) return;
      const a = aiAnnual(cfg, tier, basis);
      out.push({key, label, tok, grade, gcls, note, unit: 'visits',
                volume: a.visits, revenue: a.revenue, hatch: true});
      return;
    }
    const clicks = ann.levers[tier][key];
    out.push({key, label, tok, grade, gcls, note, unit: 'clicks',
              volume: clicks, revenue: clicks * cfg.rpv, hatch: false});
  });
  const total = out.reduce((a, r) => a + r.revenue, 0);
  out.forEach(r => r.share = total ? r.revenue / total : 0);
  return {rows: out, totalRevenue: total,
          searchRevenue: out.filter(r => r.key !== 'ai').reduce((a, r) => a + r.revenue, 0),
          searchClicks: ann.clicks[tier]};
}

function revenueSeries(cfg, tier, component, basis, endISO, stride) {
  const st = stride || 7;
  if (component === 'ai') {
    const rpv = aiBaseline(basis).rpv;
    return aiSeries(cfg, tier, basis, endISO, st).map(p => ({...p, v: p.v * rpv}));
  }
  if (component === 'search' || component === 'google' || component === 'bing') {
    const eng = component === 'search' ? 'both' : component;
    return weeklySeries(cfg, 'clicks', tier, eng, null, st, endISO)
      .map(p => ({...p, v: p.v * cfg.rpv}));
  }
  const search = revenueSeries(cfg, tier, 'search', basis, endISO, st);
  if (!cfg.includeAi) return search;
  const ai = revenueSeries(cfg, tier, 'ai', basis, endISO, st);
  // Same launch, end and stride, so the day grids align index for index.
  return search.map((p, i) => ({...p, v: p.v + ai[i].v}));
}

// The stack, in draw order. AI appears only when included, so a chart built from this
// cannot show a band the headline does not count.
function revenueComponents(cfg) {
  const out = [['google', 'Google', '--lv-measured'], ['bing', 'Bing', '--lv-bing']];
  if (cfg.includeAi) out.push(['ai', 'AI assistants', '--lv-index']);
  return out;
}

function trajectory(cfg, engine, tier, trends) {
  const L = dayNum(cfg.launch), end = dayNum(cfg.decision);
  const endISO = cfg.decision;
  const baseMo = baselineMonthly(engine, trends);
  const heldMo = heldMonthly(engine, trends);
  const daily = engine === 'ai'
    ? aiSeries(cfg, tier, trends.aiBasis, endISO, 1)
    : weeklySeries(cfg, 'clicks', tier,
        {google: 'google', bing: 'bing', combined: 'both'}[engine], null, 1, endISO);
  const incMo = {};
  let prev = 0;
  daily.forEach(p => {
    incMo[p.month] = (incMo[p.month] || 0) + (p.v - prev);
    prev = p.v;
  });
  const rows = [];
  const seen = new Set();
  for (let d = L; d <= end; d++) {
    const dt = new Date(d * DAY);
    const key = dt.getUTCFullYear() + '-' + (dt.getUTCMonth() + 1);
    if (seen.has(key)) continue;
    seen.add(key);
    const m = dt.getUTCMonth() + 1;
    rows.push({year: dt.getUTCFullYear(), month: m,
               held: heldMo[m] || 0,
               baseline: baseMo[m] || 0, incremental: incMo[m] || 0});
  }
  return rows;
}

// ═══ formatters ═════════════════════════════════════════════════════════════
const fmtUSD = n => {
  if (!isFinite(n)) return '—';
  const a = Math.abs(n), sg = n < 0 ? '-' : '';
  if (a >= 1e9) return sg + '$' + (a / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return sg + '$' + (a / 1e6).toFixed(2) + 'M';
  if (a >= 1e3) return sg + '$' + Math.round(a / 1e3) + 'K';
  return sg + '$' + Math.round(a);
};
const fmtC = n => {
  if (!isFinite(n)) return '—';
  const a = Math.abs(n), sg = n < 0 ? '-' : '';
  if (a >= 1e9) return sg + (a / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return sg + (a / 1e6).toFixed(1) + 'M';
  if (a >= 1e3) return sg + Math.round(a / 1e3) + 'K';
  return sg + Math.round(a);
};
const fmtN = n => Math.round(n).toLocaleString('en-US');
const pct1 = x => (100 * x).toFixed(1) + '%';
// The marker strip is a dense row of figures; one decimal there is noise.
const pct0 = x => Math.round(100 * x) + '%';
// Axis ticks drop the cents fmtUSD keeps: "$20M", not "$20.00M".
const fmtAxis = n => {
  const a = Math.abs(n);
  if (a < 1) return '$0';
  if (a >= 1e9) return '$' + (a / 1e9).toFixed(a % 1e9 ? 1 : 0) + 'B';
  if (a >= 1e6) return '$' + (a / 1e6).toFixed(a % 1e6 ? 1 : 0) + 'M';
  if (a >= 1e3) return '$' + Math.round(a / 1e3) + 'K';
  return '$' + Math.round(a);
};
// Round the ceiling UP to a 1/2/2.5/5-times-power-of-ten step so ticks land on
// readable values. max*1.15 gave $76.52M / $57.39M / $38.26M, which reads as noise.
function niceMax(v, ticks) {
  if (!(v > 0)) return ticks;
  const raw = v / ticks;
  const mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 1.5 ? 1.5 : n <= 2 ? 2 : n <= 2.5 ? 2.5
                : n <= 3 ? 3 : n <= 5 ? 5 : 10) * mag;
  return step * ticks;
}
// niceMax assumes a zero floor. A zoomed range needs both ends snapped to a round
// step, or the axis prints 74.6M / 66.7M / 58.7M and reads as noise.
// Trying a single tick count leaves the axis at the mercy of a boundary: a range
// needing 5.02 units per tick tips into the 10 step and a 50-68M series lands on a
// 40-80M axis, half of it empty. So try a few counts and keep the tightest fit.
function niceScale(lo, hi, ticks) {
  const span = (hi - lo) || Math.abs(hi) || 1;
  let best = null;
  for (const t of [ticks - 1, ticks, ticks + 1, ticks + 2]) {
    if (t < 3) continue;
    const raw = span / t;
    const mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
    const step = (n <= 1 ? 1 : n <= 1.5 ? 1.5 : n <= 2 ? 2 : n <= 2.5 ? 2.5
                  : n <= 3 ? 3 : n <= 5 ? 5 : 10) * mag;
    const min = Math.floor(lo / step) * step, max = Math.ceil(hi / step) * step;
    if (!best || max - min < best.max - best.min) best = {min, max, step};
  }
  return best;
}
// Axis ticks whose precision follows the STEP, not the magnitude. fmtC prints one
// decimal at the millions scale, so a 4.33M-4.37M range labelled every 15K printed
// "4.3M / 4.4M / 4.4M / 4.4M" — five ticks, three distinct strings, all of them wrong
// by more than the gap they were meant to distinguish.
function fmtCount(v, step) {
  const a = Math.abs(v);
  const unit = a >= 1e9 ? 1e9 : a >= 1e6 ? 1e6 : a >= 1e3 ? 1e3 : 1;
  const suffix = unit === 1e9 ? 'B' : unit === 1e6 ? 'M' : unit === 1e3 ? 'K' : '';
  // Enough decimals to represent the STEP exactly, not merely to make it non-zero.
  // A 2.5M step at 0 decimals printed 58 / 60 / 63 / 65 / 68 / 70 — evenly spaced
  // gridlines wearing unevenly spaced numbers.
  const scaled = (step || unit) / unit;
  let d = 0;
  while (d < 3) {
    const t = scaled * Math.pow(10, d);
    if (Math.abs(t - Math.round(t)) < 1e-9 && t >= 1) break;
    d++;
  }
  return (v / unit).toFixed(d) + suffix;
}
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// An ISO date as prose. Built from the string rather than a Date, so it cannot shift a
// day on a viewer whose timezone is behind UTC — the trap that `new Date('2026-09-01')`
// sets, and this artifact is read in more than one timezone.
const fmtDay = iso => +iso.slice(8, 10) + ' ' + MON[+iso.slice(5, 7) - 1] + ' ' + iso.slice(0, 4);

    launch: S.launch, decision: S.decision,
    rampWeeks: S.rampWeeks, tranches: S.tranches,
    anon: S.anon / 100,
    // The sliders expose the two supplied rails; mid is their midpoint, derived here so
    // no downstream call site has to know which inputs are tiered.
    growth: {low: S.growthLo / 100, high: S.growthHi / 100,
             mid: (S.growthLo + S.growthHi) / 200},
    dial:   {low: S.dialLo / 100, high: S.dialHi / 100,
             mid: (S.dialLo + S.dialHi) / 200},
    newPagePerf: S.newPagePerf / 100,
    clicksPerPage: S.clicksPerPage,
    rpv: S.aov * S.cr / 100,
    bing: S.bing,
    includeAi: S.includeAi,
    aiBasis: S.aiBasis,
  };
}

  return {google: S.trendGoogle / 100, bing: S.trendBing / 100,
          ai: S.trendAi / 100, aiBasis: S.aiBasis};
}
