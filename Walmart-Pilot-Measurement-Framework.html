const UTILS = [
  {k:'sources', label:'Sources', title:'Provenance ledger — every input, its source and its evidence grade'},
];
const UTIL_KEYS = new Set(UTILS.map(u => u.k));
const TABBAR = STAGES.filter(s => !UTIL_KEYS.has(s.k));

// Gate state. Real implementation reads live metrics; the shell previews states.
function gateState() {
  const passed = {prelaunch: 0, deployed: 1, all: CHAIN.length}[S.preview];
  const g = {};
  CHAIN.forEach((k, i) => g[k] = i < passed ? 'pass' : (i === passed ? 'active' : 'locked'));
  return g;
}
const isLocked = k => !STAGE[k].always && gateState()[k] === 'locked';
const prevOf = k => CHAIN[CHAIN.indexOf(k) - 1];

// ═══ view helpers ═══════════════════════════════════════════════════════════
function chip(cls, text) { return `<span class="chip ${cls}">${esc(text)}</span>`; }

function slot(kind, title, note, size) {
  return `<div class="slot ${size || 'mid'}">
    <div class="sl-k">${esc(kind)}</div>
    <div class="sl-t">${esc(title)}</div>
    <div class="sl-n">${esc(note)}</div>
  </div>`;
}
function fig(title, note, inner) {
  return `<section class="fig">${title ? `<h3>${esc(title)}</h3>` : ''}`
    + (note ? `<p class="note">${esc(note)}</p>` : '') + (inner || '') + '</section>';
}
function slider(key, label, min, max, step, disp, src) {
  return `<div class="slider">
    <div class="slider-head">
      <label class="name" for="sl-${key}">${esc(label)}</label>
      <span class="out" id="out-${key}">${esc(disp)}</span>
    </div>
    <input id="sl-${key}" type="range" min="${min}" max="${max}" step="${step}"
      value="${S[key]}" data-slider="${key}" aria-label="${esc(label)}">
    ${src ? `<div class="src">${esc(src)}</div>` : ''}
  </div>`;
}
function seg(key, opts) {
  return `<div class="seg">` + opts.map(([v, l]) =>
    `<button data-seg="${key}" data-val="${v}" aria-pressed="${S[key] === v}">${esc(l)}</button>`
  ).join('') + `</div>`;
}

function statCard(k, v, s, color, glow) {
  return `<div class="stat${glow ? ' glow' : ''}">
    <i class="rail" style="background:${color || 'var(--brass-line)'}"></i>
    <div class="k">${esc(k)}</div>
    <div class="v"${glow ? '' : ` style="color:var(--ink)"`}>${esc(v)}</div>
    ${s ? `<div class="s">${esc(s)}</div>` : ''}
  </div>`;
}
function legend(items) {
  return '<div class="legend">' + items.map(([c, l]) =>
    `<span><i class="swatch" style="background:${c}"></i>${esc(l)}</span>`).join('') + '</div>';
}
// `kind`: false = solid line, true = dashed line, 'block' = a filled region. A
// shaded band must not wear a line swatch — the swatch is what tells the reader
// whether to look for a stroke or an area.
function lineLegend(items) {
  return '<div class="legend">' + items.map(([c, kind, l]) => {
    const mark = kind === 'block'
      ? `<i class="swatch" style="background:${c};opacity:.34;width:24px"></i>`
      : `<svg width="24" height="10" style="width:24px;flex:none" aria-hidden="true">`
        + `<line x1="0" y1="5" x2="24" y2="5" stroke="${c}"`
        + ` stroke-width="${kind === 'dot' ? 2 : 2.5}"`
        + ` stroke-dasharray="${kind === 'dot' ? '1 3' : kind ? '7 4' : 'none'}"/></svg>`;
    return `<span>${mark}${esc(l)}</span>`;
  }).join('') + '</div>';
}

// ═══ chart plumbing ═════════════════════════════════════════════════════════
// Charts render into a MEASURED slot rather than a scaled fixed viewBox: the
// viewBox is 1:1 with CSS pixels, so a wide card does not magnify every axis
// label. chartSlot() emits the placeholder, mountCharts() draws into it.
//
// Colours are emitted as var(--token) references rather than resolved hexes, so a
// viewer flipping their OS theme mid-meeting re-colours every chart without a
// rebuild. Reading getComputedStyle once at load, as the ROI template does, is
// safe there only because that file commits to `color-scheme: light only`.
const CHART_SPECS = {};
let chartSeq = 0;
function chartSlot(h, build) {
  const id = 'ch' + (++chartSeq);
  CHART_SPECS[id] = {h, build};
  return `<div class="chart" data-chart="${id}" style="height:${h}px"></div>`;
}
// Specs are closures over the current state, so drop them every render pass rather
// than letting a long slider drag accumulate thousands of stale ones.
function resetCharts() { for (const k in CHART_SPECS) delete CHART_SPECS[k]; }
function mountCharts() {
  document.querySelectorAll('[data-chart]').forEach(el => {
    const spec = CHART_SPECS[el.dataset.chart];
    if (!spec) return;
    el.innerHTML = spec.build(Math.max(320, Math.round(el.clientWidth || 640)));
  });
}
function emptyChart(h, msg, fix) {
  return `<div class="slot mid" style="height:${h}px">
    <div class="sl-k">No series</div><div class="sl-t">${esc(msg)}</div>
    ${fix ? `<div class="sl-n">${esc(fix)}</div>` : ''}</div>`;
}
// A straight polyline through DAILY points — deliberately not a smoothed spline.
//
// The cumulative curve's slope jumps every time a tranche crosses a 30-day adoption
// step, so it genuinely has corners at those days. Catmull-Rom rounded them off and
// made the projection look like a featureless smooth rise, which drew the fair
// criticism that the model looked as if it ignored its own structure. At daily
// sampling the segments are ~4px wide, so nothing reads as jagged.
function linePath(pts) {
  if (!pts.length) return '';
  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) d += ` L${pts[i].x.toFixed(1)},${pts[i].y.toFixed(1)}`;
  return d;
}

// ═══ shared chart geometry ══════════════════════════════════════════════════
// Both projection views stack a revenue panel over a coverage-ramp track that
// shares the x-axis. A shared x with a separate panel — never a second y-axis on
// the same plot — is how two quantities in different units go on one chart.
// PT holds the coverage marker strip; PR holds the endpoint labels, the widest of
// which is "Google 93.0%" with a swatch. One panel, not two.
// PT holds the coverage strip: a title row plus one row per scenario shown. Three
// tiers need 80px — at 60 the third row printed on top of the first y-axis label.
const GEO = {h: 498, PL: 84, PR: 120, PT: 80, RH: 340};
function geometry(W) {
  const g = Object.assign({}, GEO);
  g.cW = W - g.PL - g.PR;
  g.rTop = g.PT; g.rBot = g.PT + g.RH;
  return g;
}

// Where each tranche goes live, and where "today" falls, in launch-relative days.
function rampMarks(cfg, span) {
  const tr = trancheList(cfg);
  const marks = tr.map(([off], i) => ({day: off, label: 'T' + (i + 1)}))
                  .filter(m => m.day <= span);
  const today = dayNum(S.today) - dayNum(cfg.launch);
  return {marks, today: (today >= 0 && today <= span) ? today : null};
}

// Coverage milestones: the 30 / 60 / 90-day cadence a pilot is actually reviewed on,
// plus the exit at the decision date. The percentage at each is COMPUTED, never read
// off the ramp anchors — with a ramp longer than 30 days the tranches are on different
// adoption steps on the same day, so the blend is not any single anchor value.
function coverageMarks(cfg, span) {
  const out = [30, 60, 90].filter(d => d <= span).map(d => ({day: d, label: d + 'd'}));
  if (span > 0) out.push({day: span, label: 'exit', edge: true});
  return out;
}

// The coverage strip: markers standing on the revenue plot itself rather than a
// second chart underneath it. A separate panel made the reader do the work of
// mapping two x-axes onto each other for a quantity that is only ever read at a
// handful of moments.
function coverageStrip(g, cfg, span, tiers) {
  const px = d => g.PL + (span ? d / span : 0) * g.cW;
  const marks = coverageMarks(cfg, span);
  const {marks: tMarks, today} = rampMarks(cfg, span);
  let o = '';

  // Bottom-axis labels compete for the same strip of pixels: up to six tranche
  // go-lives plus the milestones plus today. Place them by priority and drop any
  // that would collide, rather than letting "T5" and "30d" print on top of one another.
  const placed = [];
  const claim = x => {
    if (placed.some(p => Math.abs(p - x) < 16)) return false;
    placed.push(x);
    return true;
  };
  const axisLabel = (x, text, colour) =>
    `<text x="${x.toFixed(1)}" y="${g.rBot + 15}" text-anchor="middle" font-size="10"`
    + ` font-weight="700" fill="${colour}">${esc(text)}</text>`;

  if (today !== null) claim(px(today));          // today outranks everything

  // Milestone lines. The exit marker rides the plot's right edge, which is already
  // a rule, so it gets no line of its own.
  let axis = '';
  marks.forEach(m => {
    const x = px(m.day);
    if (!m.edge) {
      o += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${g.rTop}" y2="${g.rBot}"`
        + ` stroke="var(--brass-line)" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>`;
      if (claim(x)) axis += axisLabel(x, m.label, 'var(--brass)');
    }
  });

  // Tranche go-lives — the lines, kept: they show that coverage arrives in groups.
  tMarks.forEach(m => {
    const x = Math.max(px(m.day), g.PL + 7);
    o += `<line x1="${px(m.day).toFixed(1)}" x2="${px(m.day).toFixed(1)}"`
      + ` y1="${g.rTop}" y2="${g.rBot}" stroke="var(--brass-line)" stroke-width="1"`
      + ` opacity="0.3"/>`;
    if (claim(x)) axis += axisLabel(x, m.label, 'var(--brass)');
  });
  o += axis;

  // One row of percentages per scenario shown.
  //
  // These rows caused a real misreading in review: labelled just HIGH / LOW under a
  // "CACHE COVERAGE" title, they look like an uncertainty band on coverage, or worse
  // like the ROI band itself. They are neither. Coverage is an INPUT, and each
  // scenario bundles its own ramp curve (conservative for low, aggressive for high)
  // alongside its growth rate, indexation lift and Bing target. So the title says
  // "input", and each row carries the same line swatch as the revenue curve it
  // belongs to — that tie is what stops the two rows reading as a range.
  o += `<text x="2" y="12" font-size="9" font-weight="700" letter-spacing=".06em"`
    + ` fill="var(--ink-2)">CACHE COVERAGE &mdash; AN INPUT EACH SCENARIO ASSUMES,`
    + ` NOT A MEASURED RANGE</text>`;
  tiers.forEach(([tier, dashed], i) => {
    const y = 32 + i * 17;
    o += `<line x1="${g.PL - 56}" x2="${g.PL - 42}" y1="${y - 3}" y2="${y - 3}"`
      + ` stroke="var(--series-1)" stroke-width="2.5"`
      + ` stroke-dasharray="${dashed ? '4 3' : 'none'}"/>`
      + `<text x="${g.PL - 36}" y="${y}" font-size="9.5" font-weight="700"`
      + ` letter-spacing=".05em" fill="var(--ink-3)">${tier.toUpperCase()}</text>`;
    marks.forEach(m => {
      o += `<text x="${px(m.day).toFixed(1)}" y="${y}"`
        + ` text-anchor="${m.edge ? 'end' : 'middle'}" font-size="12.5" font-weight="700"`
        + ` fill="var(${i === 0 ? '--ink' : '--ink-3'})">`
        + `${esc(pct0(rampAt(cfg, tier, m.day)))}</text>`;
    });
  });
  return {svg: o, today, px};
}

// ═══ projection charts ══════════════════════════════════════════════════════
// Shared chrome for both views: the y-axis, month separators, the coverage marker
// strip across the top, tranche go-live lines, and the today marker. ONE panel.
function chartFrame(W, cfg, span, max, tiers, aria) {
  const g = geometry(W);
  const px = d => g.PL + (span ? d / span : 0) * g.cW;
  const py = v => g.rBot - Math.min(v / max, 1) * g.RH;
  const strip = coverageStrip(g, cfg, span, tiers);

  let back = `<svg viewBox="0 0 ${W} ${g.h}" role="img" aria-label="${esc(aria)}">`;
  for (let i = 0; i <= 4; i++) {
    const v = max / 4 * i, y = py(v);
    back += `<line x1="${g.PL}" x2="${g.PL + g.cW}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"`
      + ` stroke="var(--rule-soft)" stroke-width="1"/>`
      + `<text x="${g.PL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11"`
      + ` fill="var(--ink-3)">${esc(fmtAxis(v))}</text>`;
  }
  let seen = null, months = '';
  for (let d = 0; d <= span; d++) {
    const m = monthOf(dayNum(cfg.launch) + d);
    if (m === seen) continue;
    seen = m;
    if (d > 0) {
      months += `<line x1="${px(d).toFixed(1)}" x2="${px(d).toFixed(1)}" y1="${g.rTop}"`
        + ` y2="${g.rBot}" stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 4"/>`;
    }
    months += `<text x="${px(d).toFixed(1)}" y="${g.rBot + 34}"`
      + ` text-anchor="${d === 0 ? 'start' : 'middle'}" font-size="11"`
      + ` fill="var(--ink-3)">${MON[m-1]}</text>`;
  }
  back += months;

  let front = `<line x1="${g.PL}" x2="${g.PL + g.cW}" y1="${g.rBot}" y2="${g.rBot}"`
    + ` stroke="var(--rule)" stroke-width="1"/>`
    + strip.svg
    + `<text x="${g.PL}" y="${g.rBot + 48}" font-size="10.5"`
    + ` fill="var(--ink-3)">launch</text>`
    + `<text x="${g.PL + g.cW}" y="${g.rBot + 48}" text-anchor="end" font-size="10.5"`
    + ` fill="var(--ink-3)">decision</text>`;
  // Today, when the window actually contains it. Pre-launch there is nothing
  // truthful to draw, so nothing is drawn.
  if (strip.today !== null) {
    const x = px(strip.today).toFixed(1);
    front += `<line x1="${x}" x2="${x}" y1="${g.rTop}" y2="${g.rBot}"`
      + ` stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 3"/>`
      + `<text x="${x}" y="${g.rBot + 15}" text-anchor="middle" font-size="10"`
      + ` font-weight="700" letter-spacing=".08em" fill="var(--ink-2)">TODAY</text>`;
  }
  return {g, px, py, back, front};
}

// ── view 1: the scenario range ──────────────────────────────────────────────
// Low and high are the SAME measure at two scenario settings, not two competing
// categories — so this is one hue with the range between the two lines filled,
// rather than two series fighting for attention. That also fixes the scale
// problem honestly: low sits near the floor of a shared axis because the spread
// really is ~9x, and the width of the band IS the finding.
function projectionChart(W, cfg) {
  const hi = revenueSeries(cfg, 'high', 'total', cfg.aiBasis, null, 1);
  const lo = revenueSeries(cfg, 'low', 'total', cfg.aiBasis, null, 1);
  const md = revenueSeries(cfg, 'mid', 'total', cfg.aiBasis, null, 1);
  if (!hi.length) return emptyChart(GEO.h, 'The decision date is on or before launch',
    'Move the decision date after the launch date to produce a window.');
  // The cumulative curve genuinely starts at zero on launch day; the model emits
  // week-ends only, so anchor the origin here rather than in the model.
  const H = [{day: 0, v: 0}].concat(hi.map(p => ({day: p.day, v: p.v})));
  const L = [{day: 0, v: 0}].concat(lo.map(p => ({day: p.day, v: p.v})));
  const M = [{day: 0, v: 0}].concat(md.map(p => ({day: p.day, v: p.v})));
  const span = H[H.length-1].day || 1;
  const finH = H[H.length-1].v, finL = L[L.length-1].v;
  const max = niceMax((finH || 1) * 1.15, 4);
  const F = chartFrame(W, cfg, span, max,
    [['high', false], ['mid', 'dot'], ['low', true]],
    `Cumulative in-window revenue from launch to the decision date. The high scenario`
    + ` reaches ${fmtUSD(finH)} and the low scenario ${fmtUSD(finL)}; the shaded band`
    + ` between them is the scenario range. Below, cache coverage ramps to`
    + ` ${pct1(rampAt(cfg, 'high', span))} and ${pct1(rampAt(cfg, 'low', span))}.`);
  const hiP = H.map(p => ({x: F.px(p.day), y: F.py(p.v)}));
  const loP = L.map(p => ({x: F.px(p.day), y: F.py(p.v)}));
  const mdP = M.map(p => ({x: F.px(p.day), y: F.py(p.v)}));

  let o = F.back;
  // The scenario range: high forward, then low backward. The reversed low path
  // already starts at low's endpoint, so its leading M becomes the joining L.
  const back = linePath(loP.slice().reverse());
  o += `<path d="${linePath(hiP)} L${back.slice(1)} Z"`
    + ` fill="var(--series-1)" opacity="0.11" stroke="none"/>`;
  o += `<path d="${linePath(loP)}" fill="none" stroke="var(--series-1)" stroke-width="2.5"`
    + ` stroke-dasharray="7 4" stroke-linecap="round"/>`;
  o += `<path d="${linePath(hiP)}" fill="none" stroke="var(--series-1)" stroke-width="2.5"`
    + ` stroke-linecap="round"/>`;
  // Mid sits INSIDE the band as the central estimate — same hue, dotted, so it reads as
  // a third position on one measure rather than a competing series.
  o += `<path d="${linePath(mdP)}" fill="none" stroke="var(--series-1)" stroke-width="2"`
    + ` stroke-dasharray="1 3" stroke-linecap="round" opacity="0.9"/>`;
  o += F.front;
  // endpoint markers + direct labels — mandatory, not optional
  [[finH, 'High', hiP], [M[M.length-1].v, 'Mid', mdP], [finL, 'Low', loP]].forEach(([v, name, P]) => {
    const p = P[P.length-1];
    o += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="6" fill="var(--series-1)"`
      + ` stroke="var(--bg)" stroke-width="2.5"/>`
      + `<text x="${(p.x+14).toFixed(1)}" y="${(p.y-1).toFixed(1)}" font-size="16"`
      + ` font-weight="700" fill="var(--ink)">${esc(fmtUSD(v))}</text>`
      + `<text x="${(p.x+14).toFixed(1)}" y="${(p.y+15).toFixed(1)}" font-size="11"`
      + ` font-weight="700" letter-spacing=".1em" fill="var(--ink-3)">${name.toUpperCase()}</text>`;
  });
  return o + '</svg>';
}

// ── view 2: the engine split ────────────────────────────────────────────────
// Google and Bing ARE two different things, so here they get two hues and stack to
// the scenario total. One scenario at a time: four bands (2 engines x 2 scenarios)
// cannot stack, and scaling both to the high total would squash low's Bing band to
// about two pixels. The axis follows the selected scenario and the toggle says so.
function engineChart(W, cfg, tier) {
  const comps = revenueComponents(cfg);
  const series = comps.map(([key, label, tok]) =>
    ({key, label, tok, pts: revenueSeries(cfg, tier, key, cfg.aiBasis, null, 1)}));
  if (!series[0].pts.length) return emptyChart(GEO.h, 'The decision date is on or before launch',
    'Move the decision date after the launch date to produce a window.');
  const n = series[0].pts.length;
  // Cumulative stack: each band's upper edge is the running sum of everything below.
  const edges = [];
  let acc = new Array(n).fill(0);
  series.forEach(sr => {
    acc = acc.map((v, i) => v + sr.pts[i].v);
    edges.push(acc.slice());
  });
  const finals = series.map((sr, i) => edges[i][n-1] - (i ? edges[i-1][n-1] : 0));
  const finTotal = edges[edges.length-1][n-1];
  const span = series[0].pts[n-1].day || 1;
  const max = niceMax((finTotal || 1) * 1.15, 4);
  const F = chartFrame(W, cfg, span, max, [[tier, tier === 'low']],
    `Cumulative in-window revenue for the ${tier} scenario, split by channel. `
    + series.map((sr, i) => `${sr.label} contributes ${fmtUSD(finals[i])}`).join(', ')
    + `, totalling ${fmtUSD(finTotal)}.`);

  // The origin: revenue genuinely starts at zero on launch day.
  const path = arr => [{x: F.px(0), y: F.py(0)}]
    .concat(arr.map((v, i) => ({x: F.px(series[0].pts[i].day), y: F.py(v)})));
  const baseY = F.g.rBot;
  let o = F.back;
  // Draw top band first so lower bands paint over its underside — each fill runs to
  // the baseline, and the one above it is always the taller.
  for (let i = edges.length - 1; i >= 0; i--) {
    const P = path(edges[i]);
    o += `<path d="${linePath(P)} L${P[P.length-1].x.toFixed(1)},${baseY}`
      + ` L${P[0].x.toFixed(1)},${baseY} Z" fill="var(${series[i].tok})" opacity="0.9"/>`;
  }
  edges.forEach((e, i) => {
    o += `<path d="${linePath(path(e))}" fill="none" stroke="var(${series[i].tok})"`
      + ` stroke-width="2.5" stroke-linecap="round"/>`;
  });
  o += F.front;

  // Every label in the right margin: the thinnest band here is Bing at ~7% (about
  // 22px), narrower than any label is long.
  const pT = path(edges[edges.length-1]);
  const p = pT[pT.length-1];
  const lx = p.x + 14;
  o += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="6"`
    + ` fill="var(${series[series.length-1].tok})" stroke="var(--bg)" stroke-width="2.5"/>`
    + `<text x="${lx.toFixed(1)}" y="${(p.y-1).toFixed(1)}" font-size="16"`
    + ` font-weight="700" fill="var(--ink)">${esc(fmtUSD(finTotal))}</text>`
    + `<text x="${lx.toFixed(1)}" y="${(p.y+15).toFixed(1)}" font-size="11"`
    + ` font-weight="700" letter-spacing=".1em" fill="var(--ink-3)">TOTAL</text>`;
  series.forEach((sr, i) => {
    const y = p.y + 38 + i * 32;
    o += `<rect x="${lx.toFixed(1)}" y="${(y-8).toFixed(1)}" width="9" height="9" rx="2"`
      + ` fill="var(${sr.tok})"/>`
      + `<text x="${(lx+15).toFixed(1)}" y="${y.toFixed(1)}" font-size="11.5"`
      + ` font-weight="700" fill="var(--ink-2)">${esc(sr.label)} `
      + `${esc(pct1(finTotal ? finals[i] / finTotal : 0))}</text>`
      + `<text x="${(lx+15).toFixed(1)}" y="${(y+14).toFixed(1)}" font-size="11"`
      + ` fill="var(--ink-3)">${esc(fmtUSD(finals[i]))}</text>`;
  });
  return o + '</svg>';
}

// ═══ monthly increment chart ════════════════════════════════════════════════
// The cumulative views answer "how much by the decision date". They cannot answer
// "what does a month look like", because integrating a series hides its shape — and
// that is exactly the question a smooth-looking projection provokes. This view is
// the un-integrated series, with the two things that drive each month printed
// underneath it so their relative size is visible rather than asserted.
// Every argument must be a NUMBER. Passing pre-formatted strings makes `x+w-r`
// concatenate instead of add, which yields NaN and a path that draws nothing at all
// — no error, no bar, just the labels floating over an empty plot.
function roundedTopPath(x, y, w, h, r) {
  x = +x; y = +y; w = +w; h = +h;
  r = Math.max(0, Math.min(r, w / 2, h));
  if (!(h > 0) || !(w > 0)) return '';
  const f = n => n.toFixed(1);
  return `M${f(x)},${f(y+h)} L${f(x)},${f(y+r)} Q${f(x)},${f(y)} ${f(x+r)},${f(y)}`
       + ` L${f(x+w-r)},${f(y)} Q${f(x+w)},${f(y)} ${f(x+w)},${f(y+r)}`
       + ` L${f(x+w)},${f(y+h)} Z`;
}

// A regrouping of model output, not new arithmetic: daily cumulative differenced back
// into per-month increments.
function monthlyIncrements(cfg, tier) {
  const pts = revenueSeries(cfg, tier, 'total', cfg.aiBasis, null, 1);
  const seas = seasonality(cfg);
  const out = [];
  let prev = 0;
  pts.forEach(p => {
    let row = out.length && out[out.length - 1].month === p.month ? out[out.length - 1] : null;
    if (!row) { row = {month: p.month, v: 0, covSum: 0, days: 0, seas: seas.clicks[p.month]}; out.push(row); }
    row.v += p.v - prev;
    row.covSum += rampAt(cfg, tier, p.day);
    row.days += 1;
    prev = p.v;
  });
  out.forEach(r => { r.cov = r.days ? r.covSum / r.days : 0; });
  return out;
}

function monthlyChart(W, cfg, tier) {
  const rows = monthlyIncrements(cfg, tier);
  if (!rows.length) return emptyChart(GEO.h, 'The decision date is on or before launch',
    'Move the decision date after the launch date to produce a window.');
  const h = GEO.h, PL = 84, PR = 44, PT = 34, FB = 100;
  const cW = W - PL - PR, cH = h - PT - FB;
  const max = niceMax(Math.max.apply(null, rows.map(r => r.v)) * 1.15, 4);
  const gW = cW / rows.length, bW = Math.min(gW * 0.62, 78);
  const py = v => PT + cH - Math.min(v / max, 1) * cH;
  const first = rows[0], last = rows[rows.length - 1];

  let o = `<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Revenue earned in each`
    + ` calendar month of the ${tier} scenario, rather than a running total. It rises`
    + ` from ${fmtUSD(first.v)} in ${MON[first.month-1]} to ${fmtUSD(last.v)} in`
    + ` ${MON[last.month-1]}, driven mainly by cache coverage climbing from`
    + ` ${pct0(first.cov)} to ${pct0(last.cov)} while the seasonal index moves only`
    + ` from ${first.seas.toFixed(2)} to ${last.seas.toFixed(2)}.">`;
  for (let i = 0; i <= 4; i++) {
    const v = max / 4 * i, y = py(v);
    o += `<line x1="${PL}" x2="${PL + cW}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"`
      + ` stroke="var(--rule-soft)" stroke-width="1"/>`
      + `<text x="${PL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11"`
      + ` fill="var(--ink-3)">${esc(fmtAxis(v))}</text>`;
  }
  rows.forEach((r, i) => {
    const cx = PL + i * gW + gW / 2, x = cx - bW / 2;
    const y = py(r.v), bh = PT + cH - y;
    o += `<path d="${roundedTopPath(x, y, bW, bh, 4)}"`
      + ` fill="var(--series-1)" opacity="0.9"/>`
      + `<text x="${cx.toFixed(1)}" y="${(y - 8).toFixed(1)}" text-anchor="middle"`
      + ` font-size="12.5" font-weight="700" fill="var(--ink)">${esc(fmtUSD(r.v))}</text>`
      + `<text x="${cx.toFixed(1)}" y="${PT + cH + 20}" text-anchor="middle" font-size="12"`
      + ` font-weight="700" fill="var(--ink-2)">${MON[r.month-1]}</text>`
      + `<text x="${cx.toFixed(1)}" y="${PT + cH + 44}" text-anchor="middle" font-size="12"`
      + ` font-weight="700" fill="var(--brass)">${esc(pct0(r.cov))}</text>`
      + `<text x="${cx.toFixed(1)}" y="${PT + cH + 66}" text-anchor="middle" font-size="12"`
      + ` fill="var(--ink-3)">${r.seas.toFixed(3)}</text>`;
  });
  o += `<line x1="${PL}" x2="${PL + cW}" y1="${PT + cH}" y2="${PT + cH}"`
    + ` stroke="var(--rule)" stroke-width="1"/>`
    // Gutter labels naming the two footer rows, so the numbers are not bare.
    + `<text x="${PL - 10}" y="${PT + cH + 44}" text-anchor="end" font-size="9.5"`
    + ` font-weight="700" letter-spacing=".05em" fill="var(--brass)">CACHE COV.</text>`
    + `<text x="${PL - 10}" y="${PT + cH + 66}" text-anchor="end" font-size="9.5"`
    + ` font-weight="700" letter-spacing=".05em" fill="var(--ink-3)">SEASONALITY</text>`;
  return o + '</svg>';
}

// ═══ trajectory chart ═══════════════════════════════════════════════════════
// History first, then the projection, on one timeline.
//
// This chart was rebuilt after a fair criticism: with only the Sep-Dec window on it,
// the line ROSE on holiday seasonality and read as growth, while the actual story is
// a 10.8% year-on-year decline. Worse, the December value (~66M clicks that month)
// was naturally read as a full-window total. Both problems have the same cause — no
// prior context — and the same fix.
//
// Showing the trailing 8 complete months makes the first point Dec 2025 ACTUAL and the
// last Dec 2026 PROJECTED: the same calendar month at both ends, so the decline is
// simply the gap between them.
function monthlyFull(engine) {
  return engine === 'ai' ? {} : (TRAJ().monthlyFull[engine] || {});
}
const priorYm = ym => String(+ym.slice(0, 4) - 1) + '-' + ym.slice(5, 7);

// Month-by-month year-over-year, oldest first. Empty for Bing and therefore Combined:
// the ingested Bing pull covers 365 days from 2025-08-01, so no Bing month has a prior
// year to compare against. A collection gap, not a property of the data.
function yoySeries(engine) {
  const md = monthlyFull(engine), out = [];
  Object.keys(md).sort().forEach(ym => {
    const p = priorYm(ym);
    if (!md[p]) return;
    const cur = md[ym].total, prior = md[p].total;
    out.push({ym, prior_ym: p, clicks: cur, prior_clicks: prior,
              change: prior ? cur / prior - 1 : null});
  });
  return out;
}

// The year-to-date comparison, plus whether it is getting better or worse. The split
// matters: Walmart's Google decline averages -11.1% across nine months while the last
// three run -17.1%, so one average hides an accelerating trend.
function yoySummary(engine, recent) {
  const ser = yoySeries(engine);
  if (!ser.length) return null;
  const r = recent || 3;
  const agg = rows => {
    const c = rows.reduce((a, x) => a + x.clicks, 0);
    const p = rows.reduce((a, x) => a + x.prior_clicks, 0);
    return {clicks: c, prior_clicks: p, change: p ? c / p - 1 : null};
  };
  const ytd = agg(ser), tail = ser.length >= r ? agg(ser.slice(-r)) : null;
  return {months: ser.length, first: ser[0].ym, last: ser[ser.length-1].ym,
          ytd, recent: tail, recentN: r,
          accelerating: !!(tail && ytd.change !== null && tail.change !== null
                           && tail.change < ytd.change),
          series: ser};
}

function trajectoryRows(cfg, engine, tier, trends) {
  const lD = new Date(dayNum(cfg.launch) * DAY);
  const lY = lD.getUTCFullYear(), lM = lD.getUTCMonth() + 1;
  const lKey = lY * 12 + lM;
  const ymOf = (y, m) => y + '-' + String(m).padStart(2, '0');

  const rows = (TRAJ().history[engine] || [])
    .filter(h => h.year * 12 + h.month < lKey)
    .map(h => ({ym: h.ym, year: h.year, month: h.month, actual: h.clicks,
                baseline: null, withUs: null, phase: 'actual'}));

  const baseMo = baselineMonthly(engine, trends);
  // Months after the last actual but before launch: a real baseline, and no lift,
  // because the pilot is not running yet. Bridges the gap where the archive's last
  // complete month sits short of launch.
  if (rows.length) {
    let y = rows[rows.length-1].year, m = rows[rows.length-1].month, guard = 0;
    for (;;) {
      m++; if (m > 12) { m = 1; y++; }
      if (y * 12 + m >= lKey || ++guard > 36) break;
      rows.push({ym: ymOf(y, m), year: y, month: m, actual: null,
                 baseline: baseMo[m] || 0, withUs: baseMo[m] || 0, phase: 'prelaunch'});
    }
  }
  trajectory(cfg, engine, tier, trends).forEach(r =>
    rows.push({ym: ymOf(r.year, r.month), year: r.year, month: r.month, actual: null,
               baseline: r.baseline, withUs: r.baseline + r.incremental, phase: 'pilot'}));
  // Last year's actual for the same calendar month, where a complete one is held. The
  // gap between this and `actual` IS the decline — and for the projected months the gap
  // to `baseline` is exactly the trend, since baseline is prior-year x (1 + trend).
  const md = monthlyFull(engine);
  rows.forEach(r => {
    const p = md[priorYm(r.ym)];
    r.prior = p ? p.total : null;
  });
  return rows;
}

function trajectoryChart(W, cfg, engine, tier, trends) {
  const rows = trajectoryRows(cfg, engine, tier, trends);
  if (!rows.length) return emptyChart(430, 'No series for this channel',
    'No history is held for it, and the window produced no projection.');
  // The prior-year series has to be in the extent, or it draws outside the plot: last
  // December was 77.4M against a 75M ceiling set by the current-year series alone, and
  // the reference line silently clipped off the top of the frame.
  const extent = [];
  rows.forEach(r => {
    if (r.actual !== null) extent.push(r.actual);
    if (r.baseline !== null) extent.push(r.baseline);
    if (r.withUs !== null) extent.push(r.withUs);
    if (r.prior !== null && r.prior !== undefined) extent.push(r.prior);
  });
  const clean = extent.filter(v => isFinite(v));
  const hi = Math.max.apply(null, clean), lo = Math.min.apply(null, clean);
  const pad = (hi - lo) * 0.18 || hi * 0.04 || 1;
  const sc = niceScale(Math.max(0, lo - pad), hi + pad, 5);
  // PB holds three stacked rows below the axis: month, year, then LAUNCH and the
  // truncated-axis warning side by side.
  const h = 444, PL = 82, PR = 150, PT = 34, PB = 68;
  const cW = W - PL - PR, cH = h - PT - PB;
  const n = rows.length;
  const px = i => PL + (n > 1 ? i / (n - 1) * cW : cW / 2);
  const py = v => PT + cH - ((v - sc.min) / (sc.max - sc.min || 1)) * cH;
  const firstProj = rows.findIndex(r => r.actual === null);
  const hasHistory = firstProj > 0;

  let o = `<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Monthly clicks for`
    + ` ${esc(TRAJ().engines[engine].label)}: ${hasHistory ? rows[0].ym + ' actual through '
      + rows[firstProj-1].ym + ', then projected to ' + rows[n-1].ym : 'projected only'}.`
    + ` ${hasHistory ? 'Against ' + fmtCount(rows[0].actual, sc.step) + ' in ' + rows[0].ym
        + ', the final month projects to ' + fmtCount(rows[n-1].baseline, sc.step)
        + ' without Botify and ' + fmtCount(rows[n-1].withUs, sc.step) + ' with it.' : ''}">`;

  for (let v = sc.min; v <= sc.max + sc.step / 2; v += sc.step) {
    const y = py(v);
    o += `<line x1="${PL}" x2="${PL + cW}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"`
      + ` stroke="var(--rule-soft)" stroke-width="1"/>`
      + `<text x="${PL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11"`
      + ` fill="var(--ink-3)">${esc(fmtCount(v, sc.step))}</text>`;
  }
  // The axis is truncated and the unit is per-month, not a total. Both stated, because
  // the December value was previously read as a window total.
  o += `<text x="${PL - 8}" y="${PT + cH + 46}" text-anchor="end" font-size="9"`
    + ` font-weight="700" letter-spacing=".04em" fill="var(--flag)">AXIS DOES NOT START AT 0</text>`
    + `<text x="${PL}" y="${PT - 18}" font-size="9.5" font-weight="700"`
    + ` letter-spacing=".07em" fill="var(--ink-3)">CLICKS PER MONTH &mdash; NOT A TOTAL</text>`;

  // Projected region, tinted and labelled, so actual and modelled never blur.
  if (hasHistory) {
    const bx = (px(firstProj - 1) + px(firstProj)) / 2;
    o += `<rect x="${bx.toFixed(1)}" y="${PT}" width="${(PL + cW - bx).toFixed(1)}"`
      + ` height="${cH}" fill="var(--brass-line)" opacity="0.05"/>`
      + `<line x1="${bx.toFixed(1)}" x2="${bx.toFixed(1)}" y1="${PT}" y2="${PT + cH}"`
      + ` stroke="var(--rule)" stroke-width="1"/>`
      + `<text x="${(bx - 6).toFixed(1)}" y="${PT - 6}" text-anchor="end" font-size="9.5"`
      + ` font-weight="700" letter-spacing=".07em" fill="var(--ink-2)">ACTUAL</text>`
      + `<text x="${(bx + 6).toFixed(1)}" y="${PT - 6}" font-size="9.5" font-weight="700"`
      + ` letter-spacing=".07em" fill="var(--brass)">PROJECTED</text>`;

  }
  // Launch, wherever it falls in the sequence.
  const lIdx = rows.findIndex(r => r.phase === 'pilot');
  if (lIdx > 0) {
    o += `<line x1="${px(lIdx).toFixed(1)}" x2="${px(lIdx).toFixed(1)}" y1="${PT}"`
      + ` y2="${PT + cH}" stroke="var(--brass-line)" stroke-width="1" stroke-dasharray="3 4"/>`
      + `<text x="${px(lIdx).toFixed(1)}" y="${PT + cH + 46}" text-anchor="middle"`
      + ` font-size="9.5" font-weight="700" fill="var(--brass)">LAUNCH</text>`;
  }
  rows.forEach((r, i) => {
    o += `<text x="${px(i).toFixed(1)}" y="${PT + cH + 18}" text-anchor="middle"`
      + ` font-size="10.5" fill="var(--ink-3)">${MON[r.month-1]}</text>`;
    if (r.month === 1 || i === 0) {
      o += `<text x="${px(i).toFixed(1)}" y="${PT + cH + 31}" text-anchor="middle"`
        + ` font-size="9" fill="var(--ink-3)">${r.year}</text>`;
    }
  });

  // Series. The projection lines are seeded from the last actual so the timeline reads
  // as one line rather than three unrelated fragments.
  const seg = pick => {
    const out = [];
    if (hasHistory) out.push({x: px(firstProj-1), y: py(rows[firstProj-1].actual)});
    for (let i = firstProj; i < n; i++) out.push({x: px(i), y: py(pick(rows[i]))});
    return out;
  };
  const actP = rows.slice(0, hasHistory ? firstProj : 0)
    .map((r, i) => ({x: px(i), y: py(r.actual)}));
  const baseP = seg(r => r.baseline), withP = seg(r => r.withUs);

  // Last year, same months. Drawn first and faintest: it is the reference everything
  // else is measured against, not a forecast. Where it exists, the vertical gap to the
  // black actual line IS the year-over-year decline, month by month.
  const priorP = rows.map((r, i) => r.prior !== null ? {x: px(i), y: py(r.prior)} : null)
                     .filter(Boolean);
  const hasPrior = priorP.length >= 2;
  if (hasPrior) {
    o += `<path d="${linePath(priorP)}" fill="none" stroke="var(--series-2)"`
      + ` stroke-width="2" stroke-dasharray="2 4" opacity="0.85" stroke-linecap="round"/>`;

  }

  const backP = linePath(baseP.slice().reverse());
  o += `<path d="${linePath(withP)} L${backP.slice(1)} Z" fill="var(--series-1)"`
    + ` opacity="0.14" stroke="none"/>`;
  o += `<path d="${linePath(baseP)}" fill="none" stroke="var(--ink-3)" stroke-width="2.5"`
    + ` stroke-dasharray="7 4" stroke-linecap="round"/>`;
  o += `<path d="${linePath(withP)}" fill="none" stroke="var(--series-1)"`
    + ` stroke-width="2.5" stroke-linecap="round"/>`;
  if (actP.length) {
    o += `<path d="${linePath(actP)}" fill="none" stroke="var(--ink)" stroke-width="2.5"`
      + ` stroke-linecap="round"/>`;
    actP.forEach(p => o += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3"`
      + ` fill="var(--ink)"/>`);
  }
  o += `<line x1="${PL}" x2="${PL + cW}" y1="${PT + cH}" y2="${PT + cH}"`
    + ` stroke="var(--rule)" stroke-width="1"/>`;

  // Endpoint labels, pushed apart — the two projection lines converge whenever the
  // lift is small, and each label needs two rows.
  const last = rows[n-1];
  // The gain in clicks AND in money. Every other surface on this tab is in dollars, so a
  // clicks-only label invites the reader to price the gap themselves — and "62.4 vs 61.1"
  // was read as a difference of about one dollar.
  const gain = last.withUs - last.baseline;
  const gainRev = gain * cfg.rpv;
  const ends = [{v: last.withUs, label: 'WITH BOTIFY', col: 'var(--series-1)',
                 y: py(last.withUs), rows: 3,
                 delta: '+' + fmtC(gain) + ' clicks · ' + fmtUSD(gainRev)},
                {v: last.baseline, label: 'WITHOUT', col: 'var(--ink-3)',
                 y: py(last.baseline), rows: 3}];
  // The prior-year endpoint joins the same spacing pass — otherwise "LAST YEAR" lands on
  // top of whichever projected label happens to sit near it.
  if (hasPrior && last.prior !== null && last.prior !== undefined) {
    ends.push({v: last.prior, label: 'LAST YEAR', col: 'var(--series-2)',
               y: py(last.prior), rows: 1, marker: false});
  }
  ends.sort((a, b) => a.y - b.y);
  // Push apart top-down, giving each label room for the rows it actually draws.
  for (let i = 1; i < ends.length; i++) {
    const need = ends[i-1].rows === 1 ? 20 : 48;
    if (ends[i].y - ends[i-1].y < need) ends[i].y = ends[i-1].y + need;
  }
  const overflow = ends[ends.length-1].y - (PT + cH - 4);
  if (overflow > 0) ends.forEach(e => e.y -= overflow);
  ends.forEach(e => {
    const lx = px(n-1) + 13;
    if (e.rows === 1) {
      o += `<text x="${lx.toFixed(1)}" y="${(e.y + 4).toFixed(1)}" font-size="9.5"`
        + ` font-weight="700" letter-spacing=".07em" fill="${e.col}">${e.label}`
        + ` ${esc(fmtCount(e.v, sc.step))}</text>`;
      return;
    }
    o += `<circle cx="${px(n-1).toFixed(1)}" cy="${py(e.v).toFixed(1)}" r="5.5"`
      + ` fill="${e.col}" stroke="var(--bg)" stroke-width="2.5"/>`
      // fmtC, not fmtCount(sc.step): the axis step is 10M, which rounded 62.4M and 61.1M
      // both to "62M" and "61M" and hid the entire lift this chart exists to show.
      + `<text x="${lx.toFixed(1)}" y="${(e.y-1).toFixed(1)}" font-size="13.5"`
      + ` font-weight="700" fill="var(--ink)">${esc(fmtC(e.v))}</text>`
      + `<text x="${lx.toFixed(1)}" y="${(e.y+13).toFixed(1)}" font-size="9.5"`
      + ` font-weight="700" letter-spacing=".08em" fill="${e.col}">${e.label}</text>`
      // Each label says what matters for it: the with-Botify line reports the LIFT, the
      // baseline reports the decline. Both saying "vs last year" left the lift — the one
      // quantity the chart is about — stated nowhere on it. Comparison is always against
      // the same calendar month a year earlier, never the first month plotted.
      + `<text x="${lx.toFixed(1)}" y="${(e.y+25).toFixed(1)}" font-size="9.5"`
      + ` fill="var(--ink-3)">${e.delta || (last.prior
          ? (e.v / last.prior - 1 >= 0 ? '+' : '') + pct1(e.v / last.prior - 1)
            + ' vs ' + MON[last.month-1] + ' ' + (last.year - 1)
          : MON[last.month-1] + ' ' + last.year)}</text>`;
  });
  return o + '</svg>';
}

// ═══ annual composition bar ═════════════════════════════════════════════════
// Share of ANNUAL revenue by component. Revenue, not clicks: the search levers are in
// clicks and AI in visits, and only revenue lets all of them sit on one bar.
//
// AI is the teal with a diagonal hatch rather than a fifth hue. The validator was
// explicit — a second teal step cannot clear the normal-vision floor against the base
// teal (ΔE 11–15 against a floor of 15), and giving AI a step of the indexation orange
// would imply a relationship between two unrelated things. Hatching also reads as
// weaker evidence, which is exactly what two weeks of data is.
function compositionBar(W, cfg) {
  const tiers = ['low', 'high'];
  const LBL = 52, BAR = 56, GAP = 34, PT = 6;
  const h = PT + tiers.length * BAR + (tiers.length - 1) * GAP + 26;
  const cW = W - LBL - 4;
  const lo = annualComposition(cfg, 'low', cfg.aiBasis);
  let o = `<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Share of annual incremental`
    + ` revenue by component. In the low scenario, measured non-branded traffic is`
    + ` ${pct1((lo.rows.find(r => r.key === 'traffic_measured') || {}).share || 0)} of the`
    + ` total.">`
    + `<defs><pattern id="aihatch" width="7" height="7" patternUnits="userSpaceOnUse"`
    + ` patternTransform="rotate(45)">`
    + `<rect width="7" height="7" fill="var(--lv-bing)"/>`
    + `<line x1="0" y1="0" x2="0" y2="7" stroke="var(--surface)" stroke-width="2.6"/>`
    + `</pattern></defs>`;
  tiers.forEach((t, ri) => {
    const comp = annualComposition(cfg, t, cfg.aiBasis);
    const y = PT + ri * (BAR + GAP);
    o += `<text x="0" y="${y + BAR/2 + 5}" font-size="13" font-weight="700"`
      + ` fill="var(--ink-2)">${t === 'low' ? 'Low' : 'High'}</text>`;
    let x = LBL;
    comp.rows.forEach(r => {
      const w = r.share * cW;
      if (w <= 0) return;
      const wv = Math.max(w - 2, 0.5);   // 2px surface gap between fills
      o += `<rect x="${x.toFixed(1)}" y="${y}" width="${wv.toFixed(1)}" height="${BAR}"`
        + ` rx="4" fill="${r.hatch ? 'url(#aihatch)' : 'var(' + r.tok + ')'}"`
        + ` opacity="0.95"/>`;
      if (w >= 42) {
        o += `<text x="${(x + wv/2).toFixed(1)}" y="${y + BAR/2 + 5}" text-anchor="middle"`
          + ` font-size="13" font-weight="700"`
          + ` fill="var(${r.hatch ? '--on-bing' : r.tok.replace('--lv-', '--on-')})">`
          + `${pct1(r.share)}</text>`;
      }
      x += w;
    });
    o += `<text x="${LBL}" y="${y + BAR + 17}" font-size="11.5" fill="var(--ink-3)">`
      + `${esc(fmtUSD(comp.totalRevenue))} a year at full coverage &#183; `
      + `${esc(fmtC(comp.searchClicks))} search clicks`
      + `${cfg.includeAi ? ' + AI visits' : ''}</text>`;
  });
  return o + '</svg>';
}

// ═══ masthead ═══════════════════════════════════════════════════════════════
function pilotState() {
  const t = s2d(S.today), l = s2d(S.launch), d = s2d(S.decision);
  const span = Math.round((d - l) / DAY);
  if (t < l) return {label:'Pre-launch', detail:`launches in ${Math.round((l-t)/DAY)} days`, span};
  if (t > d) return {label:'Post-decision', detail:'window closed', span};
  const day = Math.round((t - l) / DAY) + 1;
  return {label:`Day ${day} of ${span}`, detail:`${Math.round((d-t)/DAY)} days to decision`, span};
}

// ═══ internal-use bar ═══════════════════════════════════════════════════════
// Renders above the masthead, first thing on the page. Comes out only when the
// artifact is single-account and cleared for the client — which is a decision, not

// ═══ tabs ═══════════════════════════════════════════════════════════════════
// ALL arithmetic happens here; the figure builders below only format.
function deriveForecast() {
  const cfg = cfgFromState();
  const ann = annualTargets(cfg);
  const span = dayNum(cfg.decision) - dayNum(cfg.launch);
  // The floor: the same window counting ZERO anonymized traffic. This is the
  // figure that survives any challenge, so it is computed, never asserted.
  const zero = Object.assign({}, cfg, {anon: 0});
  const win = {}, floor = {}, exit = {};
  for (const t of TIERS) {
    const clicks = cumulative(cfg, 'clicks', t);
    const split = revenueSplit(cfg, t, cfg.aiBasis);
    win[t] = {clicks, revenue: split.total, search: split.search,
              ai: split.ai, aiVisits: split.aiVisits,
              impressions: cumulative(cfg, 'impressions', t),
              keywords: cumulative(cfg, 'keywords', t)};
    floor[t] = cumulative(zero, 'clicks', t) * cfg.rpv;
    exit[t] = rampAt(cfg, t, span);
  }
  // Engine split. google + bing === total by construction, so `total` is read from
  // the combined series rather than added up — if those ever disagree, the number on
  // screen is the one the range view shows and the discrepancy is visible.
  const engines = {};
  for (const t of TIERS) {
    const tot = weeklySeries(cfg, 'clicks', t);
    const goo = weeklySeries(cfg, 'clicks', t, 'google');
    const total = (tot.length ? tot[tot.length-1].v : 0) * cfg.rpv;
    const google = (goo.length ? goo[goo.length-1].v : 0) * cfg.rpv;
    const bing = total - google;
    const shareAt = i => {
      if (!tot.length) return 0;
      const a = tot[i].v, b = goo[i].v;
      return a > 0 ? (a - b) / a : 0;
    };
    engines[t] = {total, google, bing,
                  share: total ? bing / total : 0,
                  shareStart: shareAt(0),
                  shareEnd: shareAt(tot.length - 1)};
  }
  // What "low" and "high" actually mean, decomposed. Each is a BUNDLE of four
  // assumptions, and the cache ramp-up is one of them — which is why the coverage
  // figures on the chart are scenario-linked inputs and not a range on coverage.
  // Isolate the ramp by running the low scenario against the high scenario's curve:
  // everything else is held at low, so the difference is the ramp and nothing else.
  const lowOnFastRamp = cumulative(cfg, 'clicks', 'low', 'both', 'aggressive') * cfg.rpv;
  const spread = win.low.revenue ? win.high.revenue / win.low.revenue : 0;
  const rampX = win.low.revenue ? lowOnFastRamp / win.low.revenue : 0;
  const bundle = {
    spread, rampX,
    restX: rampX ? spread / rampX : 0,
    lowOnFastRamp,
    curves: {low: DATA.ramp[PAIR.low], high: DATA.ramp[PAIR.high]},
  };
  const monthly = {};
  TIERS.forEach(t => monthly[t] = monthlyIncrements(cfg, t));

  // Trajectory: their year with us against their year without us.
  const trends = trendsFromState();
  const traj = {};
  for (const eng of ['google', 'bing', 'ai', 'combined']) {
    const rows = trajectory(cfg, eng, S.trajTier, trends);
    const b = rows.reduce((a, r) => a + r.baseline, 0);
    const inc = rows.reduce((a, r) => a + r.incremental, 0);
    const spec = TRAJ().engines[eng];
    // Window-scoped, not annual: the trend effect over a Sep-Dec window is the sum
    // of those four months grown, minus the same four months as measured. Using the
    // trailing-twelve-month total here would compare a 4-month projection against a
    // 12-month base and overstate the decline threefold.
    const held = rows.reduce((a, r) => a + r.held, 0);
    const trendDelta = b - held;
    traj[eng] = {rows, baseline: b, incremental: inc, withUs: b + inc,
                 deviation: b ? inc / b : 0,
                 held, trendDelta,
                 // How much of the decline the lift gives back. Only meaningful
                 // when the trend is actually negative.
                 offset: trendDelta < 0 ? inc / Math.abs(trendDelta) : null,
                 spec};
  }
  return {cfg, ann, span, win, floor, exit, engines, bundle, monthly,
          traj, trends, ai: aiBaseline(trends.aiBasis),
          trancheCount: trancheList(cfg).length,
          weights: bucketWeights(cfg)};
}
